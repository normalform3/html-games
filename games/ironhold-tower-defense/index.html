<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>铁壁王国 · 中世纪塔防</title>
<style>
  :root{
    --bg:#080d09;
    --panel:rgba(20,28,20,.82);
    --panel-2:rgba(12,18,13,.9);
    --line:rgba(219,188,126,.16);
    --line-strong:rgba(224,195,132,.34);
    --gold:#d8b36a;
    --gold-hi:#f2d99d;
    --ink:#ece5d4;
    --muted:#968f7d;
    --danger:#d96b5f;
    --archer:#c8dc8f;
    --barracks:#9dc2d8;
    --mage:#b9a1e8;
    --serif:"Palatino Linotype","Songti SC","Noto Serif SC",STSong,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    min-height:100vh;
    overflow:hidden;
    color:var(--ink);
    background:
      radial-gradient(1100px 580px at 72% -12%, #2a4331 0%, transparent 60%),
      radial-gradient(900px 620px at 2% 108%, #1b2c20 0%, transparent 56%),
      linear-gradient(180deg,#0b120d,#070b08);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.22;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 4px),
      radial-gradient(circle at 30% 20%, rgba(235,206,143,.1), transparent 40%);
    mix-blend-mode:soft-light;
  }
  button{font-family:inherit}
  button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
  #app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}

  /* ---------- top bar ---------- */
  .topbar{
    position:relative;flex:none;display:flex;align-items:center;gap:22px;
    padding:11px clamp(14px,2.4vw,28px);
    background:linear-gradient(180deg,rgba(13,20,15,.94),rgba(9,14,10,.74));
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .topbar::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(222,190,123,.5),transparent);
    opacity:.6;
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:max-content}
  .crest{
    width:40px;height:44px;display:grid;place-items:center;color:var(--gold-hi);
    filter:drop-shadow(0 0 10px rgba(216,179,106,.2));
  }
  .crest svg{width:34px;height:38px}
  .brand h1{font:600 18px/1.1 var(--serif);letter-spacing:.09em;margin:0}
  .brand p{font-size:8px;letter-spacing:.28em;color:var(--muted);margin:3px 0 0;font-weight:600}
  .hud{display:flex;align-items:stretch;gap:6px;margin-left:auto}
  .hud-item{
    display:flex;align-items:center;gap:7px;min-height:38px;padding:5px 11px;
    border:1px solid var(--line);border-radius:9px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  }
  .hud-icon{display:grid;place-items:center;color:var(--gold);opacity:.92}
  .hud-icon svg{width:16px;height:16px}
  .hud-icon.life{color:#d98a7b}
  .hud-icon.gold{color:var(--gold-hi)}
  .hud-label{font-size:9.5px;letter-spacing:.12em;color:var(--muted)}
  .hud-item strong{font:600 15px/1 var(--mono);min-width:2.5ch;text-align:right;color:var(--ink)}
  .hud-item.flash strong{color:var(--danger)}
  .controls{display:flex;align-items:center;gap:7px}
  .btn{
    appearance:none;border:1px solid rgba(224,196,136,.24);border-radius:9px;
    padding:10px 14px;background:rgba(255,255,255,.035);color:var(--ink);
    font:500 12px/1 var(--sans);letter-spacing:.03em;white-space:nowrap;cursor:pointer;
    transition:background .16s,border-color .16s,transform .16s,opacity .16s;
  }
  .btn:hover{background:rgba(255,255,255,.08);border-color:rgba(224,196,136,.45)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.42;cursor:default;transform:none}
  .btn.primary{
    color:#241b0d;font-weight:700;border-color:#f3dca2;
    background:linear-gradient(180deg,#edd28d,#c49a4b);
    box-shadow:0 5px 22px -10px rgba(218,179,100,.6),inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn.primary:hover{background:linear-gradient(180deg,#f6dfa0,#d2a85a)}
  .btn.primary.ready{animation:readyPulse 2.8s ease-in-out infinite}
  @keyframes readyPulse{
    0%,100%{box-shadow:0 5px 22px -10px rgba(218,179,100,.45),inset 0 1px 0 rgba(255,255,255,.35)}
    50%{box-shadow:0 6px 28px -8px rgba(240,211,145,.72),inset 0 1px 0 rgba(255,255,255,.4)}
  }
  .btn.small{padding:9px 11px;font-family:var(--mono);font-size:11px;min-width:43px}
  .btn.sound-btn{min-width:40px;padding:8px 10px;display:inline-flex;align-items:center;justify-content:center}
  .btn.sound-btn svg{width:17px;height:17px;overflow:visible}
  .btn.sound-btn .mute-x{display:none}
  .btn.sound-btn.muted .sound-wave{display:none}
  .btn.sound-btn.muted .mute-x{display:block}
  .btn.sound-btn.muted{color:#8f8777}
  .btn.ghost{background:rgba(0,0,0,.16)}

  /* ---------- layout ---------- */
  main{
    flex:1;min-height:0;width:100%;max-width:1460px;margin:0 auto;
    display:grid;grid-template-columns:minmax(0,1fr) 318px;gap:14px;
    padding:13px clamp(12px,2.2vw,24px) 14px;
  }
  .stage-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;gap:8px}
  .stage{flex:1;min-height:0;display:grid;place-items:center}
  .board{
    position:relative;
    width:min(100%, calc((100vh - 196px) * 1.6));
    aspect-ratio:8/5;
    border-radius:14px;overflow:hidden;
    background:#172319;
    border:1px solid rgba(224,195,132,.32);
    box-shadow:0 26px 70px -32px #000, inset 0 0 0 1px rgba(0,0,0,.55), 0 0 0 4px rgba(0,0,0,.16);
    isolation:isolate;
  }
  #game{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .map-plate{
    position:absolute;left:13px;top:12px;z-index:2;
    appearance:none;font-family:inherit;cursor:pointer;
    display:flex;align-items:baseline;gap:7px;padding:4px 9px;
    border:1px solid rgba(232,207,154,.18);border-radius:5px;
    background:linear-gradient(180deg,rgba(10,15,10,.75),rgba(10,15,10,.5));
    box-shadow:0 3px 12px rgba(0,0,0,.24);
    transition:border-color .16s,background .16s;
  }
  .map-plate:hover{border-color:rgba(232,207,154,.45);background:rgba(16,24,17,.86)}
  .map-plate span{font:600 10.5px/1 var(--serif);letter-spacing:.14em;color:#d7c9a9}
  .map-plate small{font-size:7px;letter-spacing:.16em;color:var(--muted)}
  .map-plate .map-chevron{font:9px/1 var(--sans);color:var(--gold);letter-spacing:0;margin-left:1px}
  .hintbar{
    flex:none;min-height:15px;text-align:center;font-size:10.5px;line-height:1.45;
    color:var(--muted);letter-spacing:.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hintbar b{color:#c9b78f;font-weight:500}

  /* ---------- toast / pause / overlay ---------- */
  .toast{
    position:absolute;left:50%;bottom:18px;z-index:5;pointer-events:none;
    transform:translate(-50%,8px);opacity:0;max-width:86%;
    padding:8px 14px;border-radius:7px;border:1px solid rgba(224,195,132,.28);
    background:rgba(9,14,10,.9);color:#e7ddc7;font-size:12px;line-height:1.5;text-align:center;
    box-shadow:0 10px 30px -12px #000;backdrop-filter:blur(7px);
    transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.warn{border-color:rgba(217,107,95,.5);color:#f1cbc5}
  .toast.good{border-color:rgba(157,194,216,.42);color:#d6e8f1}
  .pause-badge{
    position:absolute;top:14px;left:50%;z-index:4;transform:translateX(-50%) translateY(-4px);
    opacity:0;pointer-events:none;padding:6px 13px;border-radius:5px;
    border:1px solid rgba(224,195,132,.3);background:rgba(8,12,9,.86);
    color:#e8d7ae;font-size:10px;letter-spacing:.2em;transition:.18s;
  }
  .pause-badge.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .overlay{
    position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:rgba(4,8,5,.7);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    opacity:0;pointer-events:none;transition:opacity .24s;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .overlay-card{
    width:min(86%,396px);padding:27px 28px 23px;text-align:center;
    border:1px solid rgba(224,195,132,.32);border-radius:13px;
    background:
      radial-gradient(400px 160px at 50% 0%,rgba(216,179,106,.13),transparent 75%),
      linear-gradient(180deg,rgba(25,34,23,.99),rgba(11,17,12,.99));
    box-shadow:0 30px 80px -20px #000,inset 0 1px 0 rgba(255,255,255,.05);
    transform:translateY(8px) scale(.98);transition:transform .24s;
  }
  .overlay.show .overlay-card{transform:none}
  .overlay .kicker{
    margin:0 0 7px;font-size:9px;font-weight:700;letter-spacing:.32em;color:var(--gold);
  }
  .overlay.lose .kicker{color:#d98a7b}
  .overlay-card h2{
    margin:0 0 10px;font:600 29px/1.25 var(--serif);letter-spacing:.1em;color:#f0e5cf;
  }
  .overlay-desc{margin:0 auto 18px;max-width:290px;font-size:11.5px;line-height:1.8;color:var(--muted)}
  .overlay-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 20px}
  .overlay-stats div{
    padding:8px 5px;border:1px solid rgba(224,195,132,.12);border-radius:7px;
    background:rgba(255,255,255,.025);
  }
  .overlay-stats span{display:block;font-size:8px;letter-spacing:.12em;color:var(--muted);margin-bottom:3px}
  .overlay-stats strong{font:600 14px/1 var(--mono);color:var(--gold-hi)}
  .overlay-actions{display:flex;flex-direction:column;gap:6px}
  .overlay-sub{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .overlay-actions .btn{width:100%;padding:11px 12px}
  .overlay-actions .btn[hidden]{display:none}

  /* ---------- level select ---------- */
  .level-overlay{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    padding:24px;overflow:auto;overscroll-behavior:contain;
    background:
      radial-gradient(1100px 560px at 50% -12%,rgba(52,77,55,.5),transparent 64%),
      rgba(3,7,4,.9);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity .28s;
  }
  .level-overlay.show{opacity:1;pointer-events:auto}
  body.level-open{overflow:hidden}
  .level-screen{position:relative;width:min(1120px,100%);margin:auto;padding:10px 0 4px}
  .level-kicker{margin:0 0 7px;font:700 9px/1 var(--sans);letter-spacing:.32em;color:var(--gold)}
  .level-screen h2{margin:0 0 9px;font:600 clamp(28px,3.6vw,40px)/1.2 var(--serif);letter-spacing:.11em;color:#f1e6d0}
  .level-lede{max-width:650px;margin:0;font-size:11.5px;line-height:1.8;color:var(--muted)}
  .level-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:24px 0 16px}
  .level-card{
    position:relative;display:flex;flex-direction:column;min-width:0;padding:0;overflow:hidden;
    appearance:none;text-align:left;color:var(--ink);font-family:inherit;cursor:pointer;
    border:1px solid rgba(224,195,132,.19);border-radius:13px;
    background:
      radial-gradient(300px 130px at 50% 0%,rgba(216,179,106,.08),transparent 72%),
      linear-gradient(180deg,rgba(25,34,24,.95),rgba(11,17,12,.96));
    box-shadow:0 18px 45px -32px #000;
    transition:transform .18s,border-color .18s,box-shadow .18s;
  }
  .level-card:hover{transform:translateY(-4px);border-color:rgba(224,195,132,.55);box-shadow:0 26px 55px -30px #000}
  .level-card.current{border-color:var(--level-accent,var(--gold));box-shadow:inset 0 0 0 1px rgba(216,179,106,.25),0 20px 50px -30px #000}
  .level-map{display:block;position:relative;flex:none;aspect-ratio:8/5;border-bottom:1px solid var(--line);background:#0a110c;overflow:hidden}
  .level-map svg{display:block;width:100%;height:100%}
  .level-body{display:flex;flex-direction:column;gap:7px;padding:13px 14px 14px;flex:1}
  .level-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .level-index{font:600 9.5px/1 var(--mono);letter-spacing:.18em;color:var(--level-accent,var(--gold))}
  .level-diff{font-size:8px;letter-spacing:.08em;padding:3px 7px;border-radius:999px;border:1px solid rgba(224,195,132,.18);color:#b7aa91}
  .level-name{display:block;margin:0;font:600 20px/1.2 var(--serif);letter-spacing:.06em;color:#ede2cb}
  .level-en{margin:-3px 0 0;font-size:7.5px;letter-spacing:.22em;color:#706a5c}
  .level-desc{margin:0;min-height:52px;font-size:10px;line-height:1.7;color:#a69d89}
  .level-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
  .level-meta span{font:8.5px/1.2 var(--mono);color:#9c927d;border:1px solid rgba(224,195,132,.1);border-radius:4px;padding:3px 5px;background:rgba(0,0,0,.12)}
  .level-cta{display:flex;align-items:center;justify-content:space-between;margin-top:2px;font-size:9.5px;letter-spacing:.12em;color:var(--level-accent,var(--gold-hi))}
  .level-cta::after{content:"→";font-size:13px;line-height:1;transition:transform .16s}
  .level-card:hover .level-cta::after{transform:translateX(3px)}
  .level-close{
    position:absolute;top:-4px;right:0;z-index:2;width:34px;height:34px;display:grid;place-items:center;
    appearance:none;cursor:pointer;border-radius:50%;border:1px solid rgba(224,195,132,.22);
    background:rgba(0,0,0,.26);color:#c9b78f;font:22px/1 var(--sans);transition:.16s;
  }
  .level-close:hover{background:rgba(255,255,255,.08);color:#fff}
  .level-close[hidden]{display:none}
  .level-foot{display:flex;align-items:center;justify-content:center;gap:9px;margin:0;text-align:center;font-size:9px;letter-spacing:.08em;color:#665f51}
  .level-foot span{color:var(--gold);opacity:.55;font-size:7px}

  /* ---------- sidebar ---------- */
  .sidebar{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-right:2px}
  .side-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
  .side-head h2{margin:0;font:600 16px/1.2 var(--serif);letter-spacing:.1em;color:#e8ddc7}
  .side-head span{font-size:8px;letter-spacing:.24em;color:var(--muted)}
  .shop{display:flex;flex-direction:column;gap:8px}
  .shop-card{
    position:relative;display:flex;align-items:center;gap:11px;width:100%;
    padding:10px 11px;text-align:left;color:var(--ink);cursor:pointer;
    border:1px solid var(--line);border-radius:10px;
    background:linear-gradient(180deg,rgba(255,255,255,.038),rgba(255,255,255,.012));
    transition:background .16s,border-color .16s,transform .16s,opacity .16s;
  }
  .shop-card::before{
    content:"";position:absolute;left:0;top:11px;bottom:11px;width:2px;border-radius:2px;
    background:var(--accent);opacity:.45;
  }
  .shop-card:hover{transform:translateX(2px);border-color:rgba(224,195,132,.34);background:rgba(255,255,255,.06)}
  .shop-card.active{
    border-color:var(--accent);
    background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.026));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 8px 22px -18px var(--accent);
  }
  .shop-card.no-money{opacity:.52}
  .shop-card.no-money .price{color:#d98a7b}
  .shop-icon{
    display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:9px;
    color:var(--accent);border:1px solid rgba(255,255,255,.08);
    background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.09),rgba(0,0,0,.24));
  }
  .shop-icon svg{width:30px;height:30px}
  .shop-copy{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .shop-name{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em}
  .shop-desc{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shop-price{display:flex;align-items:center;gap:4px;font:600 11px/1 var(--mono);color:var(--gold-hi)}
  .shop-price .coin{color:var(--gold)}
  kbd{
    font:9px/1 var(--mono);color:#716b5d;border:1px solid rgba(255,255,255,.1);
    border-radius:3px;padding:2px 4px;background:rgba(0,0,0,.16);
  }
  .panel{
    flex:1;min-height:150px;padding:14px;border-radius:11px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(25,34,24,.82),rgba(12,18,13,.82));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  }
  .panel-title{margin:0 0 7px;font:600 14px/1.3 var(--serif);letter-spacing:.07em;color:#e9dec8}
  .panel .lede{margin:0 0 12px;font-size:10.5px;line-height:1.8;color:var(--muted)}
  .tip-list{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
  .tip-row{display:flex;gap:8px;align-items:flex-start;font-size:10.5px;line-height:1.65;color:#a9a18e}
  .tip-dot{width:5px;height:5px;flex:none;margin-top:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 7px rgba(216,179,106,.5)}
  .tip-row b{color:#d8cbb2;font-weight:600}
  .next-wave{
    margin-top:13px;padding-top:11px;border-top:1px solid var(--line);
    font-size:9.5px;line-height:1.6;color:var(--muted);
  }
  .next-wave span{display:block;color:#c8b994;margin-top:2px}
  .sel-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .sel-emblem{
    width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;
    border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.2);color:var(--accent);
  }
  .sel-emblem svg{width:23px;height:23px}
  .sel-name{margin:0;font:600 15px/1.2 var(--serif);letter-spacing:.06em}
  .sel-role{margin:2px 0 0;font-size:9px;color:var(--muted);letter-spacing:.08em}
  .level-pips{display:flex;gap:4px;margin:2px 0 11px}
  .level-pips i{width:16px;height:3px;border-radius:1px;background:rgba(255,255,255,.12)}
  .level-pips i.on{background:var(--accent);box-shadow:0 0 6px rgba(216,179,106,.32)}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
  .stat-cell{padding:6px 8px;border:1px solid rgba(255,255,255,.055);border-radius:6px;background:rgba(0,0,0,.13)}
  .stat-cell span{display:block;font-size:8px;letter-spacing:.11em;color:var(--muted);margin-bottom:2px}
  .stat-cell b{font:600 12px/1.2 var(--mono);color:#e9ddc5}
  .sel-note{margin:0 0 10px;font-size:9.5px;line-height:1.65;color:#9e957f}
  .sel-note b{color:#d7c49a}
  .sel-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .sel-actions .btn{padding:9px 7px;font-size:10.5px;text-align:center}
  .sel-actions .btn.wide{grid-column:1/-1}
  .sel-actions .btn.no-money{color:#d89286;border-color:rgba(217,107,95,.32)}
  .sel-actions .btn.primary.no-money{
    color:rgba(52,37,18,.62);border-color:rgba(243,220,162,.48);
    background:linear-gradient(180deg,#d7c08a,#b89a61);opacity:.84;
  }
  .sel-actions .btn:disabled{opacity:.4}
  .sidebar::-webkit-scrollbar{width:4px}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(224,195,132,.16);border-radius:4px}

  /* ---------- responsive ---------- */
  @media (max-width:1000px){
    body{overflow:auto;min-height:100vh}
    #app{height:auto;min-height:100vh}
    .topbar{flex-wrap:wrap;gap:10px 16px;padding:11px 14px}
    .brand{flex:1 1 auto}
    .hud{margin-left:auto;order:2}
    .controls{margin-left:auto;order:3}
    main{display:flex;flex-direction:column;padding:12px;gap:11px}
    .stage-wrap{min-height:0}
    .board{width:100%}
    .hintbar{white-space:normal}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2d = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

let activePaths = [];
let pathCells = new Set();

function makePath(grid, lane) {
  const points = grid.map(function (pt) {
    return { x: pt[0] * CELL + CELL / 2, y: pt[1] * CELL + CELL / 2 };
  });
  const segs = [];
  let length = 0;
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push({ a, b, len, start: length, angle: Math.atan2(b.y - a.y, b.x - a.x) });
    length += len;
  }
  return { grid, points, segs, length, lane };
}

function pointOnPath(path, distance) {
  const d = clamp(distance, 0, path.length);
  for (let i = 0; i < path.segs.length; i++) {
    const s = path.segs[i];
    if (d <= s.start + s.len || i === path.segs.length - 1) {
      const t = s.len === 0 ? 0 : clamp((d - s.start) / s.len, 0, 1);
      return {
        x: s.a.x + (s.b.x - s.a.x) * t,
        y: s.a.y + (s.b.y - s.a.y) * t,
        angle: s.angle
      };
    }
  }
  const last = path.points[path.points.length - 1];
  return { x: last.x, y: last.y, angle: 0 };
}

function nearestOnPath(x, y) {
  let best = { x: 0, y: 0, d: Infinity, pathIndex: 0 };
  for (let pi = 0; pi < activePaths.length; pi++) {
    const path = activePaths[pi];
    for (const s of path.segs) {
      const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y;
      const l2 = dx * dx + dy * dy || 1;
      const t = clamp(((x - s.a.x) * dx + (y - s.a.y) * dy) / l2, 0, 1);
      const px = s.a.x + dx * t, py = s.a.y + dy * t;
      const d = Math.hypot(x - px, y - py);
      if (d < best.d) best = { x: px, y: py, d, pathIndex: pi };
    }
  }
  return best;
}

function rebuildPathData() {
  pathCells = new Set();
  for (const path of activePaths) {
    for (let i = 0; i < path.grid.length - 1; i++) {
      const [x1, y1] = path.grid[i], [x2, y2] = path.grid[i + 1];
      const dx = Math.sign(x2 - x1), dy = Math.sign(y2 - y1);
      let x = x1, y = y1;
      while (true) {
        if (x >= 0 && x < COLS && y >= 0 && y < ROWS) pathCells.add(x + ',' + y);
        if (x === x2 && y === y2) break;
        x += dx; y += dy;
      }
    }
  }
}

function pathProgress(enemy) {
  const path = activePaths[enemy.pathIndex] || activePaths[0];
  return path ? enemy.dist / path.length : 0;
}

const BASE_WAVES = [

  [{ type: 'wolf', count: 12, gap: 0.38, delay: 0.5 }, { type: 'orc', count: 4, gap: 1.10, delay: 3.2 }, { type: 'boss', count: 1, gap: 1, delay: 5.6 }]

function makeLaneWaves(laneCount) {
  return BASE_WAVES.map(function (wave) {
    const groups = [];
    for (const group of wave) {
      const perLane = Math.floor(group.count / laneCount);
      const extra = group.count % laneCount;
      const counts = new Array(laneCount).fill(perLane);
      for (let i = 0; i < extra; i++) counts[i]++;
      if (group.type === 'boss' && laneCount > 1) {
        counts.fill(0);
        counts[Math.min(1, laneCount - 1)] = group.count;
      }
      for (let lane = 0; lane < laneCount; lane++) {
        const count = counts[lane];
        if (!count) continue;
        groups.push({
          type: group.type,
          count: count,
          gap: group.gap,
          delay: group.delay + lane * 0.32,
          path: lane
        });
      }
    }
    return groups;
  });
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function roundRect(g, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.arcTo(x + w, y, x + w, y + h, rr);
  g.arcTo(x + w, y + h, x, y + h, rr);
  g.arcTo(x, y + h, x, y, rr);
  g.arcTo(x, y, x + w, y, rr);
  g.closePath();
}

function inBounds(gx, gy) { return gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS; }
function isPathCell(gx, gy) { return pathCells.has(gx + ',' + gy); }
function cellKey(x, y) { return x + ',' + y; }
function towerAt(gx, gy) { return state.towers.find(t => t.gx === gx && t.gy === gy) || null; }
function getTower(id) { return state.towers.find(t => t.id === id) || null; }
function getSelected() { return state.selectedId ? getTower(state.selectedId) : null; }
function towerCenter(t) { return { x: t.gx * CELL + CELL / 2, y: t.gy * CELL + CELL / 2 }; }
function soldierHome(t, slot) {

}

function burst(x, y, color, count, power) {

const SFX = (function () {
  const STORAGE_KEY = 'ironhold-muted';
  const MASTER = 0.46;
  let ac = null;
  let master = null;
  let noiseBuffer = null;
  let muted = false;
  const lastPlayed = Object.create(null);

  try { muted = localStorage.getItem(STORAGE_KEY) === '1'; } catch (err) { /* file:// may deny storage */ }

  const gaps = {
    arrow: 0.055, magic: 0.08, hit: 0.045, sword: 0.08,
    coin: 0.05, blast: 0.06, click: 0.035, deny: 0.25

  function audioSupported() {
    return !!(window.AudioContext || window.webkitAudioContext);
  }

  function ensure() {
    if (muted) return null;
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        ac = new AC();
      } catch (err) {
        return null;
      }
      master = ac.createGain();
      master.gain.value = MASTER;
      const compressor = ac.createDynamicsCompressor();
      compressor.threshold.value = -20;
      compressor.knee.value = 24;
      compressor.ratio.value = 5;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.22;
      master.connect(compressor);
      compressor.connect(ac.destination);
      noiseBuffer = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') {
      ac.resume().catch(function () {});
    }
    return ac;
  }

  function unlock() {
    ensure();
  }

  function setMuted(value) {
    muted = !!value;
    try { localStorage.setItem(STORAGE_KEY, muted ? '1' : '0'); } catch (err) { /* ignore */ }
    if (!muted) {
      ensure();
      if (master && ac) master.gain.setTargetAtTime(MASTER, ac.currentTime, 0.03);
    } else if (master && ac) {
      master.gain.setTargetAtTime(0, ac.currentTime, 0.02);
    }
  }

  function toggleMuted() {
    setMuted(!muted);
    return muted;
  }

  function tone(freq, dur, opts) {
    if (!ac) return;
    const o = opts || {};
    const t = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + dur);
    const peak = o.gain == null ? 0.025 : o.gain;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t + (o.attack || 0.006));
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (o.filter) {
      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = o.filter;
      osc.connect(filter);
      filter.connect(gain);
    } else {
      osc.connect(gain);
    }
    gain.connect(master);
    osc.start(t);
    osc.stop(t + dur + 0.04);
  }

  function noise(dur, opts) {
    if (!ac || !noiseBuffer) return;
    const o = opts || {};
    const t = ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer;
    const filter = ac.createBiquadFilter();
    filter.type = o.type || 'bandpass';
    filter.frequency.setValueAtTime(o.freq || 1200, t);
    filter.Q.value = o.q || 1;
    if (o.sweep) filter.frequency.exponentialRampToValueAtTime(Math.max(40, o.sweep), t + dur);
    const gain = ac.createGain();
    const peak = o.gain == null ? 0.03 : o.gain;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    src.start(t);
    src.stop(t + dur + 0.03);
  }

  const recipes = {
    click: function () {

    rally: function () {

    magic: function () {

    blast: function () {

    }
  };

  function play(name) {
    if (muted) return;
    const ctx = ensure();
    if (!ctx) return;
    const now = ctx.currentTime;
    const gap = gaps[name] || 0;
    if (gap && lastPlayed[name] != null && now - lastPlayed[name] < gap) return;
    lastPlayed[name] = now;
    if (recipes[name]) recipes[name]();
  }

  function debugState() {
    return {
      supported: audioSupported(),
      muted: muted,
      context: ac ? ac.state : 'none'
    };
  }

  return { play: play, unlock: unlock, toggleMuted: toggleMuted, setMuted: setMuted, isMuted: function () { return muted; }, debugState: debugState };
})();

function drawPathBase(g) {
  g.lineCap = 'round';
  g.lineJoin = 'round';
  const theme = activeTheme;

  for (const path of activePaths) {
    if (path.points.length < 2) continue;
    g.beginPath();
    g.moveTo(path.points[0].x, path.points[0].y);
    for (let i = 1; i < path.points.length; i++) g.lineTo(path.points[i].x, path.points[i].y);

    g.strokeStyle = 'rgba(4,8,5,.55)';
    g.lineWidth = 54;
    g.stroke();

    g.strokeStyle = theme.pathEdge;
    g.lineWidth = 44;
    g.stroke();

    g.strokeStyle = theme.pathOuter;
    g.lineWidth = 36;
    g.stroke();

    g.strokeStyle = theme.pathInner;
    g.lineWidth = 30;
    g.stroke();

    g.strokeStyle = 'rgba(227,197,135,.10)';
    g.lineWidth = 2;
    g.setLineDash([6, 16]);
    g.stroke();
    g.setLineDash([]);

    const rand = mulberry32(90210 + path.lane * 771);
    for (let d = 8; d < path.length; d += 17) {
      const p = pointOnPath(path, d);
      const nx = Math.cos(p.angle + Math.PI / 2);
      const ny = Math.sin(p.angle + Math.PI / 2);
      const off = (rand() * 2 - 1) * 12;
      const x = p.x + nx * off, y = p.y + ny * off;
      g.beginPath();
      g.ellipse(x, y, 2.2 + rand() * 2.8, 1.1 + rand() * 1.4, p.angle + rand(), 0, TAU);
      g.fillStyle = rand() > 0.5 ? 'rgba(187,151,104,.32)' : 'rgba(60,47,32,.3)';
      g.fill();
    }

    for (let d = 14; d < path.length; d += 25) {
      const p = pointOnPath(path, d);
      const nx = Math.cos(p.angle + Math.PI / 2);
      const ny = Math.sin(p.angle + Math.PI / 2);
      for (const sign of [-1, 1]) {
        const off = 20 + rand() * 4;
        const x = p.x + nx * off * sign;
        const y = p.y + ny * off * sign;
        g.beginPath();
        g.ellipse(x, y, 3 + rand() * 2.5, 2 + rand() * 1.6, p.angle + rand(), 0, TAU);
        g.fillStyle = 'rgba(62,54,39,.8)';
        g.fill();
        g.strokeStyle = 'rgba(196,171,120,.1)';
        g.lineWidth = 0.8;
        g.stroke();
      }
    }
  }
}

    g.fill();

    g.strokeStyle = '#5e5a45';
    g.lineWidth = 5;
    g.beginPath();
    g.moveTo(911, gateY + 34);
    g.lineTo(911, gateY - 13);
    g.quadraticCurveTo(911, gateY - 38, 939, gateY - 38);
    g.lineTo(960, gateY - 38);
    g.stroke();
    g.strokeStyle = 'rgba(223,198,139,.3)';
    g.lineWidth = 1.2;
    g.beginPath();
    g.moveTo(908, gateY - 37);
    g.lineTo(908, gateY + 36);
    g.stroke();
    g.fillStyle = '#6a6249';
    g.fillRect(907, gateY + 30, 53, 6);
    g.fillStyle = 'rgba(0,0,0,.35)';
    g.fillRect(907, gateY + 36, 53, 3);

    // portcullis
    g.strokeStyle = 'rgba(158,146,111,.45)';
    g.lineWidth = 1.1;
    for (let x = 920; x < 960; x += 7) {
      g.beginPath();
      g.moveTo(x, gateY - 28);
      g.lineTo(x, gateY + 26);
      g.stroke();
    }
    for (let y = gateY - 21; y < gateY + 24; y += 9) {
      g.beginPath();
      g.moveTo(916, y);
      g.lineTo(960, y);
      g.stroke();
    }

    // torches beside each gate
    for (const ty of [gateY - 45, gateY + 45]) {
      if (ty < wallTop + 12 || ty > wallBottom - 12) continue;
      const glow = g.createRadialGradient(902, ty, 0, 902, ty, 20);
      glow.addColorStop(0, 'rgba(255,184,88,.34)');
      glow.addColorStop(0.3, 'rgba(255,160,70,.12)');
      glow.addColorStop(1, 'rgba(255,160,70,0)');
      g.fillStyle = glow;
      g.beginPath();
      g.arc(902, ty, 20, 0, TAU);
      g.fill();
      g.fillStyle = '#f0c06e';
      g.beginPath();
      g.ellipse(902, ty, 1.6, 3.2, 0, 0, TAU);
      g.fill();
    }

    // hanging banner above the gate
    const bY = gateY - 75;
    g.fillStyle = theme.banner;
    g.beginPath();
    g.moveTo(922, bY);
    g.lineTo(943, bY);
    g.lineTo(943, bY + 26);
    g.lineTo(932.5, bY + 21);
    g.lineTo(922, bY + 26);
    g.closePath();
    g.fill();
    g.strokeStyle = 'rgba(230,199,130,.6)';
    g.lineWidth = 0.9;
    g.stroke();
    g.strokeStyle = 'rgba(230,199,130,.75)';
    g.beginPath();
    g.moveTo(932.5, bY + 6);
    g.lineTo(932.5, bY + 17);
    g.moveTo(928.5, bY + 9);
    g.lineTo(936.5, bY + 9);
    g.stroke();
  }
}

function drawEntranceAt(g, y, seed) {
  g.fillStyle = '#0a0d09';
  g.beginPath();
  g.moveTo(0, y - 44);
  g.quadraticCurveTo(28, y - 36, 32, y);
  g.quadraticCurveTo(28, y + 36, 0, y + 44);
  g.closePath();
  g.fill();

  g.strokeStyle = '#3b3c2d';
  g.lineWidth = 5;
  g.beginPath();
  g.moveTo(0, y - 48);
  g.quadraticCurveTo(31, y - 38, 35, y);
  g.quadraticCurveTo(31, y + 38, 0, y + 48);
  g.stroke();

  g.strokeStyle = 'rgba(121,133,87,.62)';
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(5, y - 35);
  g.quadraticCurveTo(22, y - 28, 23, y - 2);
  g.moveTo(3, y + 31);
  g.quadraticCurveTo(23, y + 22, 25, y + 6);
  g.stroke();

  const rand = mulberry32(seed);
  for (let i = 0; i < 6; i++) {
    const x = 7 + rand() * 32;
    const yy = y - 48 + rand() * 26 - (i % 2 ? 10 : 0);
    drawTree(g, x, yy, 0.48 + rand() * 0.36);
  }
  for (let i = 0; i < 5; i++) {
    const x = 4 + rand() * 36;
    const yy = y + 34 + rand() * 24;
    drawTree(g, x, yy, 0.44 + rand() * 0.34);
  }
}

function drawEntrance(g) {
  const starts = Array.from(new Set(activePaths.map(function (path) {
    return path.points[0].y;
  })));
  for (let i = 0; i < starts.length; i++) {
    drawEntranceAt(g, starts[i], 55 + i * 131);
  }
}

function drawTree(g, x, y, s) {
  const theme = activeTheme;
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  g.fillStyle = 'rgba(5,9,6,.32)';
  g.beginPath();
  g.ellipse(2, 11, 12, 5, 0, 0, TAU);
  g.fill();
  g.fillStyle = theme.treeTrunk || '#463726';
  g.fillRect(-1.5, -2, 3, 15);
  g.fillStyle = theme.treeDark || '#1b2c1b';
  g.beginPath();
  g.arc(0, -10, 10, 0, TAU);
  g.fill();
  g.fillStyle = theme.treeMid || '#263c24';
  g.beginPath();
  g.arc(-3, -13, 7, 0, TAU);
  g.fill();
  g.fillStyle = theme.treeLight || '#304a2b';
  g.beginPath();
  g.arc(4, -9, 5.5, 0, TAU);
  g.fill();
  g.restore();
}

function buildBackground() {
  bgCanvas.width = Math.round(W * dpr);
  bgCanvas.height = Math.round(H * dpr);
  const g = bgCtx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const theme = activeTheme;

  const base = g.createLinearGradient(0, 0, W * 0.75, H);
  base.addColorStop(0, theme.bg[0]);
  base.addColorStop(0.45, theme.bg[1]);
  base.addColorStop(1, theme.bg[2]);
  g.fillStyle = base;
  g.fillRect(0, 0, W, H);

  const rand = mulberry32(88127 + currentLevelIndex * 1307);

  // broad moss / earth patches
  for (let i = 0; i < 26; i++) {
    const x = rand() * W, y = rand() * H;
    const r = 40 + rand() * 120;
    const shade = rand() > 0.5 ? theme.patchA : theme.patchB;
    const patch = g.createRadialGradient(x, y, 0, x, y, r);
    patch.addColorStop(0, 'rgba(' + shade + ',' + (0.07 + rand() * 0.1) + ')');
    patch.addColorStop(1, 'rgba(' + shade + ',0)');
    g.fillStyle = patch;
    g.beginPath();
    g.arc(x, y, r, 0, TAU);
    g.fill();
  }

  // grass texture
  for (let i = 0; i < 260; i++) {
    const x = rand() * W, y = rand() * H;
    if (nearestOnPath(x, y).d < 31) continue;
    const h = 2 + rand() * 4;
    g.strokeStyle = rand() > 0.45 ? theme.tuftA : theme.tuftB;
    g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x - 1.4, y - h);
    g.moveTo(x + 1, y);
    g.lineTo(x + 2.1, y - h * 0.7);
    g.stroke();
  }

  // small flowers
  for (let i = 0; i < 38; i++) {
    const x = rand() * W, y = rand() * H;
    if (nearestOnPath(x, y).d < 34) continue;
    g.fillStyle = rand() > 0.4 ? theme.flowerA : theme.flowerB;
    g.beginPath();
    g.arc(x, y, 1 + rand() * 1.1, 0, TAU);
    g.fill();
  }

  // low shrubs and stones break up the open ground without hiding build tiles
  for (let i = 0; i < 30; i++) {
    const x = 34 + rand() * (W - 120);
    const y = 34 + rand() * (H - 90);
    if (nearestOnPath(x, y).d < 42) continue;
    if (x > 880) continue;
    if (rand() > 0.45) {
      const s = 0.55 + rand() * 0.55;
      g.fillStyle = 'rgba(8,13,9,.2)';
      g.beginPath();
      g.ellipse(x + 2, y + 5, 12 * s, 4 * s, 0, 0, TAU);
      g.fill();
      g.fillStyle = theme.shrubDark;
      g.beginPath(); g.arc(x, y, 7 * s, 0, TAU); g.fill();
      g.fillStyle = theme.shrubMid;
      g.beginPath(); g.arc(x - 3 * s, y - 2 * s, 4.5 * s, 0, TAU); g.fill();
      g.fillStyle = theme.shrubLight;
      g.beginPath(); g.arc(x + 4 * s, y + 1, 3 * s, 0, TAU); g.fill();
    } else {
      const s = 0.5 + rand() * 0.7;
      g.fillStyle = 'rgba(6,9,7,.22)';
      g.beginPath();
      g.ellipse(x + 2, y + 4, 8 * s, 3 * s, 0, 0, TAU);
      g.fill();
      g.fillStyle = theme.stone;
      g.beginPath();
      g.moveTo(x - 7 * s, y + 3 * s);
      g.lineTo(x - 5 * s, y - 4 * s);
      g.lineTo(x + 2 * s, y - 7 * s);
      g.lineTo(x + 7 * s, y + 1);
      g.lineTo(x + 3 * s, y + 4 * s);
      g.closePath();
      g.fill();
      g.fillStyle = 'rgba(184,173,135,.2)';
      g.beginPath();
      g.moveTo(x - 4 * s, y - 3 * s);
      g.lineTo(x + 1 * s, y - 5 * s);
      g.lineTo(x + 3 * s, y - 1 * s);
      g.closePath();
      g.fill();
    }
  }

  // subtle survey grid
  g.strokeStyle = 'rgba(222,211,168,.035)';
  g.lineWidth = 1;
  for (let x = CELL; x < W; x += CELL) {
    g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); g.stroke();
  }
  for (let y = CELL; y < H; y += CELL) {
    g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); g.stroke();
  }

  drawPathBase(g);
  drawEntrance(g);
  drawCastle(g);

  // edge vignette
  const vig = g.createRadialGradient(W / 2, H / 2, H * 0.24, W / 2, H / 2, H * 0.82);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,.4)');
  g.fillStyle = vig;
  g.fillRect(0, 0, W, H);
}

/* ================================================================== *
 *  游戏逻辑
 * ================================================================== */
function configOf(t) { return TOWERS[t.type]; }

function startWave() {
  if (state.phase !== 'prep' || state.wave >= activeWaves.length || state.paused || state.levelMenuOpen) return;
  state.wave++;
  state.phase = 'wave';
  state.waveClock = 0;
  state.spawnQueue = [];
  for (const group of activeWaves[state.wave - 1]) {
    for (let i = 0; i < group.count; i++) {
      state.spawnQueue.push({
        at: group.delay + i * group.gap,
        type: group.type,
        path: group.path || 0
      });
    }
  }
  state.spawnQueue.sort((a, b) => a.at - b.at);
  state.accumulator = 0;
  showToast('第 ' + state.wave + ' 波敌人来袭', 'warn');
  SFX.play('horn');
  renderPanel();
  syncHud(true);
}

function spawnEnemy(type, pathIndex) {
  const def = ENEMIES[type];
  const lane = typeof pathIndex === 'number' ? pathIndex : 0;
  const path = activePaths[lane] || activePaths[0];
  const p = pointOnPath(path, 0);
  const hp = Math.max(1, Math.round(def.hp * currentLevel.hpMul));
  state.enemies.push({
    id: state.nextId++,
    type,
    pathIndex: path ? activePaths.indexOf(path) : 0,
    x: p.x,
    y: p.y,
    angle: p.angle,
    dist: 0,
    hp: hp,
    maxHp: hp,
    armor: def.armor,
    speed: def.speed,
    gold: Math.max(1, Math.round(def.gold * currentLevel.goldMul)),
    leak: def.leak,
    attack: def.attack,
    attackInterval: def.attackInterval,
    attackCd: 0.3 + Math.random() * 0.4,
    radius: def.radius,
    boss: !!def.boss,
    immune: !!def.immune,
    blockedBy: null,
    hit: 0,
    dead: false
  });
}

function updateSpawner(dt) {
  state.waveClock += dt;
  while (state.spawnQueue.length && state.spawnQueue[0].at <= state.waveClock) {
    const item = state.spawnQueue.shift();
    spawnEnemy(item.type, item.path || 0);
  }
}

function spawnBarracksSoldiers(t) {
  const stats = levelStats(t);
  const existing = state.soldiers.filter(s => s.barracksId === t.id).length;
  for (let slot = existing; slot < stats.count; slot++) {
    const home = soldierHome(t, slot);
    state.soldiers.push({
      id: state.nextId++,
      barracksId: t.id,
      slot,
      x: home.x, y: home.y,
      homeX: home.x, homeY: home.y,
      maxHp: stats.hp,
      hp: stats.hp,
      dmg: stats.damage,
      interval: stats.interval,
      respawnMax: stats.respawn,
      respawn: 0,
      dead: false,
      state: 'idle',
      targetId: null,
      attackCd: 0,
      outOfCombat: 0,
      hit: 0,
      facing: 1
    });
  }
}

function updateBarracksLevel(t) {
  const stats = levelStats(t);
  for (const s of state.soldiers) {
    if (s.barracksId !== t.id) continue;
    s.maxHp = stats.hp;
    s.dmg = stats.damage;
    s.interval = stats.interval;
    s.respawnMax = stats.respawn;
    if (!s.dead) s.hp = s.maxHp;
  }
  spawnBarracksSoldiers(t);
}

function tryBuild(type, gx, gy) {
  if (gameOver()) return false;
  if (!TOWERS[type] || !inBounds(gx, gy)) {
    showToast('这里无法建造', 'warn');
    SFX.play('deny');
    return false;
  }
  if (isPathCell(gx, gy)) {
    showToast('这是敌人通行的小路，不能建造', 'warn');
    SFX.play('deny');
    return false;
  }
  const existing = towerAt(gx, gy);
  if (existing) {
    selectTower(existing.id);
    return false;
  }
  const cfg = TOWERS[type];
  if (state.money < cfg.cost) {
    showToast('金币不足，先守住这一波', 'warn');
    SFX.play('deny');
    return false;
  }
  const t = {
    id: state.nextId++,
    type,
    gx,
    gy,
    level: 1,
    invested: cfg.cost,
    cooldown: 0,
    angle: -Math.PI / 2,
    builtAt: state.simTime,
    fireAt: -10,
    rally: null
  };
  const c = towerCenter(t);
  if (type === 'barracks') {
    const p = nearestOnPath(c.x, c.y);
    t.rally = { x: p.x, y: p.y };
  }
  state.towers.push(t);
  if (type === 'barracks') spawnBarracksSoldiers(t);
  state.money -= cfg.cost;
  state.buildType = null;
  state.selectedId = t.id;
  state.hover = null;
  burst(c.x, c.y, cfg.accent, 13, 55);
  SFX.play('build');
  showToast(cfg.name + '已建成');
  renderPanel();
  syncHud(true);
  return true;
}

function selectTower(id) {
  if (gameOver()) return;
  state.selectedId = id;
  state.buildType = null;
  state.hover = null;
  SFX.play('click');
  renderPanel();
  syncHud(true);
}

function upgradeSelected() {
  const t = getSelected();
  if (!t || gameOver()) return;
  if (t.level >= 3) {
    showToast('已经达到最高等级', 'warn');
    SFX.play('deny');
    return;
  }
  const cost = upgradeCost(t);
  if (state.money < cost) {
    showToast('金币不足，升不了级', 'warn');
    SFX.play('deny');
    return;
  }
  state.money -= cost;
  t.invested += cost;
  t.level++;
  if (t.type === 'barracks') updateBarracksLevel(t);
  const c = towerCenter(t);
  burst(c.x, c.y, TOWERS[t.type].accent, 18, 70);
  SFX.play('upgrade');
  showToast(TOWERS[t.type].name + '升至 ' + t.level + ' 级');
  renderPanel();
  syncHud(true);
}

function sellSelected() {
  const t = getSelected();
  if (!t || gameOver()) return;
  const refund = Math.round(t.invested * 0.65);
  state.money += refund;
  const c = towerCenter(t);
  burst(c.x, c.y, '#d8b36a', 16, 60);
  if (t.type === 'barracks') {
    for (const s of state.soldiers) {
      if (s.barracksId !== t.id || !s.targetId) continue;
      const e = state.enemies.find(en => en.id === s.targetId);
      if (e && e.blockedBy === s.id) e.blockedBy = null;
    }
    state.soldiers = state.soldiers.filter(s => s.barracksId !== t.id);
  }
  state.towers = state.towers.filter(x => x.id !== t.id);
  state.selectedId = null;
  SFX.play('sell');
  showToast(TOWERS[t.type].name + '已出售，返还 ' + refund + ' 金币');
  renderPanel();
  syncHud(true);
}

function setRally(t, p) {
  if (!t || t.type !== 'barracks') return;
  t.rally = { x: p.x, y: p.y };
  for (const s of state.soldiers) {
    if (s.barracksId !== t.id) continue;
    if (s.targetId) {
      const e = state.enemies.find(en => en.id === s.targetId);
      if (e && e.blockedBy === s.id) e.blockedBy = null;
    }
    s.targetId = null;
    s.state = 'idle';
    s.outOfCombat = 0;
    const home = soldierHome(t, s.slot);
    s.homeX = home.x; s.homeY = home.y;
  }
  burst(p.x, p.y, '#9dc2d8', 10, 40);
  SFX.play('rally');
  showToast('集结点已移动');
  renderPanel();
  syncHud(true);
}

function moveToward(s, tx, ty, speed, dt) {
  const dx = tx - s.x, dy = ty - s.y;
  const d = Math.hypot(dx, dy);
  if (d < 0.001) return;
  const step = Math.min(d, speed * dt);
  s.x += dx / d * step;
  s.y += dy / d * step;
}

function clearTarget(s) {
  if (s.targetId) {
    const e = state.enemies.find(en => en.id === s.targetId);
    if (e && e.blockedBy === s.id) e.blockedBy = null;
    s.targetId = null;
  }
  s.state = 'idle';
}

function findSoldierTarget(s) {
  const t = getTower(s.barracksId);
  if (!t) return null;
  const stats = levelStats(t);
  let best = null, bestProgress = -Infinity;
  for (const e of state.enemies) {
    if (e.dead || e.immune || e.blockedBy) continue;
    if (state.soldiers.some(o => o !== s && !o.dead && o.targetId === e.id)) continue;
    if (dist2d(e.x, e.y, t.rally.x, t.rally.y) > stats.range) continue;
    if (pathProgress(e) > bestProgress) {
      best = e;
      bestProgress = pathProgress(e);
    }
  }
  return best;
}

function killSoldier(s) {
  if (s.dead) return;
  s.dead = true;
  s.hp = 0;
  s.respawn = s.respawnMax;
  if (s.targetId) {
    const e = state.enemies.find(en => en.id === s.targetId);
    if (e && e.blockedBy === s.id) e.blockedBy = null;
  }
  s.targetId = null;
  s.state = 'dead';
  SFX.play('soldierDown');
  burst(s.x, s.y, '#9dc2d8', 10, 45);
}

function reviveSoldier(s) {
  const t = getTower(s.barracksId);
  if (!t) return;
  const stats = levelStats(t);
  const home = soldierHome(t, s.slot);
  s.dead = false;
  s.hp = stats.hp;
  s.maxHp = stats.hp;
  s.dmg = stats.damage;
  s.interval = stats.interval;
  s.respawnMax = stats.respawn;
  s.respawn = 0;
  s.homeX = home.x;
  s.homeY = home.y;
  s.x = home.x;
  s.y = home.y;
  s.state = 'idle';
  s.targetId = null;
  s.attackCd = 0;
  s.outOfCombat = 0;
  SFX.play('revive');
  burst(home.x, home.y, '#bfe0ee', 8, 35);
}

function updateSoldiers(dt) {
  for (const s of state.soldiers) {
    if (s.dead) {
      s.respawn -= dt;
      if (s.respawn <= 0) reviveSoldier(s);
      continue;
    }
    s.hit = Math.max(0, s.hit - dt);

    let target = s.targetId ? state.enemies.find(e => e.id === s.targetId && !e.dead) : null;

    if (!target) {
      if (s.targetId) clearTarget(s);
    } else if (target.immune || (target.blockedBy && target.blockedBy !== s.id)) {
      clearTarget(s);
      target = null;
    }

    if (!target) {
      target = findSoldierTarget(s);
      if (target) {
        s.targetId = target.id;
        s.state = 'move';
        s.outOfCombat = 0;
      } else {
        s.state = 'idle';
        s.outOfCombat += dt;
        const t = getTower(s.barracksId);
        if (t) {
          const home = soldierHome(t, s.slot);
          s.homeX = home.x; s.homeY = home.y;
          if (dist2d(s.x, s.y, home.x, home.y) > 2) {
            moveToward(s, home.x, home.y, 76, dt);
            s.facing = home.x >= s.x ? 1 : -1;
          }
        }
        if (s.outOfCombat > 2.5 && s.hp < s.maxHp) {
          s.hp = Math.min(s.maxHp, s.hp + 6 * dt);
        }
        continue;
      }
    }

    if (!target) continue;

    const t = getTower(s.barracksId);
    if (!t) continue;
    const stats = levelStats(t);
    if (dist2d(target.x, target.y, t.rally.x, t.rally.y) > stats.range + 45) {
      clearTarget(s);
      continue;
    }

    const d = dist2d(s.x, s.y, target.x, target.y);
    if (d <= 20 || target.blockedBy === s.id) {
      if (target.blockedBy && target.blockedBy !== s.id) {
        clearTarget(s);
        continue;
      }
      target.blockedBy = s.id;
      s.state = 'fight';
      s.facing = target.x >= s.x ? 1 : -1;
      // Stand beside the enemy instead of directly on top of it, so both
      // units remain readable while they fight.
      const side = s.slot % 2 === 0 ? -1 : 1;
      const offset = 12 + Math.floor(s.slot / 2) * 8;
      const flankAngle = target.angle + Math.PI / 2;
      const fx = target.x + Math.cos(flankAngle) * offset * side;
      const fy = target.y + Math.sin(flankAngle) * offset * side;
      if (dist2d(s.x, s.y, fx, fy) > 2.5) moveToward(s, fx, fy, 76, dt);
      s.attackCd -= dt;
      if (s.attackCd <= 0) {
        s.attackCd = s.interval;
        s.hit = 0.12;
        SFX.play('sword');
        burst(target.x, target.y, '#e8d6a4', 4, 24);
        damageEnemy(target, s.dmg, 'physical');
      }
    } else {
      if (target.blockedBy && target.blockedBy !== s.id) {
        clearTarget(s);
        continue;
      }
      s.state = 'move';
      s.facing = target.x >= s.x ? 1 : -1;
      moveToward(s, target.x, target.y, 96, dt);
    }
  }
}

function updateEnemies(dt) {
  for (const e of state.enemies) {
    if (e.dead) continue;
    e.hit = Math.max(0, e.hit - dt);

    if (e.blockedBy) {
      const s = state.soldiers.find(x => x.id === e.blockedBy && !x.dead);
      if (s && s.targetId === e.id && s.state === 'fight') {
        e.attackCd -= dt;
        if (e.attackCd <= 0) {
          e.attackCd = e.attackInterval;
          s.hp -= e.attack;
          s.hit = 0.16;
          SFX.play('hit');
          burst(s.x, s.y, '#d98a7b', 4, 24);
          if (s.hp <= 0) killSoldier(s);
        }
        continue;
      }
      e.blockedBy = null;
    }

    const path = activePaths[e.pathIndex] || activePaths[0];
    e.dist += e.speed * dt;
    if (e.dist >= path.length) {
      leakEnemy(e);
      continue;
    }
    const p = pointOnPath(path, e.dist);
    e.x = p.x;
    e.y = p.y;
    e.angle = p.angle;
  }
}

function leakEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  e.blockedBy = null;
  state.lives = Math.max(0, state.lives - e.leak);
  state.hurt = Math.min(1, state.hurt + 0.55);
  SFX.play('leak');
  const p = pointOnPath(activePaths[e.pathIndex] || activePaths[0], (activePaths[e.pathIndex] || activePaths[0]).length);
  burst(Math.min(944, p.x), p.y, '#d96b5f', 18, 80);
  if (state.lives <= 0) endGame('lost');
}

function damageEnemy(e, amount, school) {
  if (!e || e.dead) return;
  const dealt = school === 'magic' ? amount : Math.max(1, amount - e.armor);
  e.hp -= dealt;
  e.hit = 0.14;
  const color = school === 'magic' ? '#cbb4ff' : '#e8d6a4';
  burst(e.x, e.y, color, 3, 28);
  if (e.hp <= 0) {
    e.dead = true;
    e.hp = 0;
    state.money += e.gold;
    SFX.play('coin');
    burst(e.x, e.y, e.boss ? '#f0c878' : '#b6ca7b', e.boss ? 28 : 9, e.boss ? 110 : 55);
    if (e.blockedBy) {
      const s = state.soldiers.find(x => x.id === e.blockedBy);
      if (s && s.targetId === e.id) {
        s.targetId = null;
        s.state = 'idle';
      }
      e.blockedBy = null;
    }
  }
}

function updateTowers(dt) {
  for (const t of state.towers) {
    if (t.type === 'barracks') continue;
    const stats = levelStats(t);
    t.cooldown = Math.max(0, t.cooldown - dt);
    if (t.cooldown > 0) continue;
    const c = towerCenter(t);
    const targets = [];
    for (const e of state.enemies) {
      if (e.dead) continue;
      if (dist2d(e.x, e.y, c.x, c.y) <= stats.range) targets.push(e);
    }
    if (!targets.length) continue;
    targets.sort((a, b) => pathProgress(b) - pathProgress(a));
    t.angle = Math.atan2(targets[0].y - c.y, targets[0].x - c.x);
    t.cooldown = stats.interval;
    t.fireAt = state.simTime;

    if (t.type === 'archer') {
      fireArrow(t, targets[0], stats);
      if (stats.double) {
        const second = targets[1] || targets[0];
        fireArrow(t, second, stats);
      }
      SFX.play('arrow');
      burst(c.x + Math.cos(t.angle) * 13, c.y - 7 + Math.sin(t.angle) * 13, '#e8d6a4', 3, 28);
    } else if (t.type === 'mage') {
      fireOrb(t, targets[0], stats);
      SFX.play('magic');
      burst(c.x, c.y - 24, '#cbb4ff', 5, 38);
    }
  }
}

function fireArrow(t, target, stats) {
  const c = towerCenter(t);
  const angle = Math.atan2(target.y - (c.y - 6), target.x - c.x);
  state.projectiles.push({
    id: state.nextId++,
    type: 'arrow',
    x: c.x + Math.cos(angle) * 13,
    y: c.y - 8 + Math.sin(angle) * 13,
    angle,
    speed: 520,
    damage: stats.damage,
    targetId: target.id,
    splash: 0,
    life: 2.2,
    dead: false
  });
}

function fireOrb(t, target, stats) {
  const c = towerCenter(t);
  const angle = Math.atan2(target.y - (c.y - 22), target.x - c.x);
  state.projectiles.push({
    id: state.nextId++,
    type: 'orb',
    x: c.x,
    y: c.y - 22,
    angle,
    speed: 300,
    damage: stats.damage,
    targetId: target.id,
    splash: stats.splash,
    life: 2.8,
    dead: false
  });
}

function updateProjectiles(dt) {
  for (const p of state.projectiles) {
    if (p.dead) continue;
    p.life -= dt;
    if (p.life <= 0) { p.dead = true; continue; }
    const target = state.enemies.find(e => e.id === p.targetId && !e.dead);
    if (!target) { p.dead = true; continue; }
    const dx = target.x - p.x, dy = target.y - p.y;
    const d = Math.hypot(dx, dy);
    const step = p.speed * dt;
    p.angle = Math.atan2(dy, dx);
    if (d <= step + 6) {
      p.dead = true;
      if (p.type === 'arrow') {
        SFX.play('hit');
        burst(target.x, target.y, '#e8d6a4', 3, 22);
        damageEnemy(target, p.damage, 'physical');
      } else {
        const impactX = target.x, impactY = target.y;
        for (const e of state.enemies) {
          if (e.dead) continue;
          if (dist2d(e.x, e.y, impactX, impactY) > p.splash) continue;
          const amount = e.id === target.id ? p.damage : p.damage * 0.6;
          damageEnemy(e, amount, 'magic');
        }
        SFX.play('blast');
        burst(impactX, impactY, '#cbb4ff', 16, 90);
      }
    } else {
      p.x += dx / d * step;
      p.y += dy / d * step;
    }
  }
}

function updateParticles(dt) {
  for (const p of state.particles) {
    p.life -= dt;
    if (p.life <= 0) continue;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 55 * dt;
    p.vx *= 0.985;
    p.vy *= 0.985;
  }
}

function cleanup() {
  state.enemies = state.enemies.filter(e => !e.dead);
  state.projectiles = state.projectiles.filter(p => !p.dead);
  state.particles = state.particles.filter(p => p.life > 0);
}

function checkWaveClear() {
  if (state.phase !== 'wave') return;
  if (state.spawnQueue.length || state.enemies.length) return;
  const cleared = state.wave;
  const bonus = 25 + 6 * state.wave + currentLevel.clearBonus;
  state.money += bonus;
  if (cleared >= activeWaves.length) {
    endGame('won');
    return;
  }
  state.phase = 'prep';
  state.waveClock = 0;
  SFX.play('clear');
  showToast('第 ' + cleared + ' 波已清 · 奖励 +' + bonus + ' 金币', 'good');
  renderPanel();
  syncHud(true);
}

function endGame(kind) {
  if (gameOver()) return;
  clearTimeout(toastTimer);
  toastEl.className = 'toast';
  state.phase = kind;
  state.paused = false;
  state.buildType = null;
  state.selectedId = null;
  state.hover = null;

  const won = kind === 'won';
  if (won) clearedLevels.add(currentLevelIndex);
  const next = won && currentLevelIndex < LEVELS.length - 1 ? LEVELS[currentLevelIndex + 1] : null;

  renderPanel();
  syncHud(true);

  overlay.classList.toggle('lose', !won);
  overlayKicker.textContent = won ? 'VICTORY' : 'DEFEAT';
  overlayTitle.textContent = won
    ? (currentLevelIndex === LEVELS.length - 1 ? '边境全线守住了' : '战场清空')
    : '王国陷落';
  overlayDesc.textContent = won
    ? (next
        ? currentLevel.name + '的攻势已被击退。下一处战场是 ' + next.name + '，敌军会从更多路线同时压上。'
        : '三处战场的烽火次第熄灭。食人魔首领倒下了，灰岭关、双叉隘口与烬风荒原重归安宁。')
    : currentLevel.name + '的防线被突破了。重整旗鼓，换一种塔位和集结点再试一次。';
  overlayStats.innerHTML =
    '<div><span>关卡</span><strong>' + (currentLevelIndex + 1) + ' / ' + LEVELS.length + '</strong></div>' +
    '<div><span>抵达波次</span><strong>' + state.wave + ' / ' + activeWaves.length + '</strong></div>' +
    '<div><span>剩余生命</span><strong>' + Math.max(0, state.lives) + '</strong></div>';
  btnNextLevel.hidden = !next;
  if (next) btnNextLevel.textContent = '下一关 · ' + next.name;
  btnNextLevel.classList.toggle('primary', !!next);
  btnRestart.textContent = won ? '重战本关' : '重试本关';
  btnRestart.className = 'btn ' + (next ? 'ghost' : 'primary');
  btnChooseLevel.className = 'btn ghost';
  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden', 'false');
  SFX.play(won ? 'victory' : 'defeat');
}

function restart() {
  startLevel(currentLevelIndex);
}

function update(dt) {
  if (gameOver()) return;
  state.simTime += dt;
  state.hurt = Math.max(0, state.hurt - dt * 1.4);

  if (state.phase === 'wave') updateSpawner(dt);
  updateSoldiers(dt);
  updateEnemies(dt);
  if (state.lives <= 0) {
    state.lives = 0;
    endGame('lost');
    return;
  }
  updateTowers(dt);
  updateProjectiles(dt);
  updateParticles(dt);
  cleanup();
  if (state.phase === 'wave') checkWaveClear();
}

function summaryWave(def) {
  if (!def) return '战役结束';
  const order = [];
  const counts = {};
  for (const group of def) {
    if (!counts[group.type]) { counts[group.type] = 0; order.push(group.type); }
    counts[group.type] += group.count;
  }
  return order.map(type => ENEMIES[type].name + ' ×' + counts[type]).join(' · ');
}

  const t = getSelected();

      ? '战役已经结束'

          ? '第 ' + state.wave + ' 波交战中'

      '<ul class="tip-list">' +
        '<li class="tip-row"><span class="tip-dot"></span><span><b>兵营</b> 部署 2 名士兵，可选中兵营后点击附近地面移动集结点。</span></li>' +
        '<li class="tip-row"><span class="tip-dot"></span><span><b>兽人盾卫</b> 有 5 点护甲，法师塔的奥术伤害可以完全无视它。</span></li>' +
        '<li class="tip-row"><span class="tip-dot"></span><span><b>Boss</b> 免疫士兵阻挡，最终波需要足够的远程火力。</span></li>' +
      '</ul>' +
      '<div class="next-wave">' + nextLabel + '<span>' + nextLine + '</span></div>';
    hintbar.innerHTML = gameOver()
      ? '战局已结束 · 点击「再次出征」重新布防'
      : (state.buildType
          ? '<b>建造模式</b> 点击草地放下设施 · Esc 取消'
          : '<b>1 / 2 / 3</b> 选择设施 · 点击草地建造 · 选中兵营后点击地面设集结点');

  }

  const cfg = TOWERS[t.type];

  const max = t.level >= 3;
  const alive = state.soldiers.filter(s => s.barracksId === t.id && !s.dead).length;
  const totalSoldiers = state.soldiers.filter(s => s.barracksId === t.id).length;

  let statCells = '';
  let note = cfg.desc;
  if (t.type === 'archer') {
    statCells =
      '<div class="stat-cell"><span>伤害</span><b>' + stats.damage + '</b></div>' +
      '<div class="stat-cell"><span>射程</span><b>' + stats.range + '</b></div>' +
      '<div class="stat-cell"><span>攻击间隔</span><b>' + stats.interval.toFixed(2) + 's</b></div>' +
      '<div class="stat-cell"><span>特性</span><b>' + (stats.double ? '双箭齐发' : '单体射击') + '</b></div>';
    if (stats.double) note = '每次攻击射出两支箭，优先选择路径上最靠前的两个目标。';
  } else if (t.type === 'mage') {
    statCells =
      '<div class="stat-cell"><span>魔法伤害</span><b>' + stats.damage + '</b></div>' +
      '<div class="stat-cell"><span>溅射范围</span><b>' + stats.splash + '</b></div>' +
      '<div class="stat-cell"><span>攻击间隔</span><b>' + stats.interval.toFixed(2) + 's</b></div>' +
      '<div class="stat-cell"><span>护甲</span><b>无视</b></div>';
  } else {
    statCells =
      '<div class="stat-cell"><span>士兵</span><b id="soldierCount">' + alive + ' / ' + totalSoldiers + '</b></div>' +
      '<div class="stat-cell"><span>生命</span><b>' + stats.hp + '</b></div>' +
      '<div class="stat-cell"><span>近战伤害</span><b>' + stats.damage + '</b></div>' +
      '<div class="stat-cell"><span>复活时间</span><b>' + stats.respawn + 's</b></div>';
    note = '点击地面移动集结点（兵营周围 130 范围）。士兵脱战后会缓慢回血。';
  }

  panel.innerHTML =
    '<div class="sel-head">' +
      '<div class="sel-emblem" style="color:' + cfg.accent + '">' + iconFor(t.type) + '</div>' +
      '<div><h3 class="sel-name">' + cfg.name + ' · Lv.' + t.level + '</h3><p class="sel-role">' + cfg.role + '</p></div>' +
    '</div>' +
    '<div class="level-pips">' + [1, 2, 3].map(i => '<i class="' + (i <= t.level ? 'on' : '') + '"></i>').join('') + '</div>' +
    '<div class="stat-grid">' + statCells + '</div>' +
    '<p class="sel-note">' + note + '</p>' +
    '<div class="sel-actions">' +
      (max
