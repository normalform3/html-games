      '<button class="btn ghost wide" type="button" data-action="sell">出售 · 返还 ◈ ' + refund + '</button>' +
    '</div>';
  hintbar.innerHTML = t.type === 'barracks'
    ? '<b>兵营</b> 点击地面移动集结点 · Esc 取消选择'
    : '<b>' + cfg.name + '</b> 选中 · 升级或出售 · Esc 取消选择';
  syncHud(true);
}

function iconFor(type) {
  if (type === 'archer') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 21h12M8.5 21V10h7v11M7 10l5-6 5 6M12 15h3"/></svg>';
  if (type === 'mage') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M7 21h10M9 21V10h6v11M8 10l4-6 4 6"/><circle cx="12" cy="15" r="2"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 20 7v6.3c0 4.5-3.1 7.3-8 10.2-4.9-2.9-8-5.7-8-10.2V7l8-4.2Z"/><path d="m8.5 12 2.4 2.4 4.6-5"/></svg>';
}

function syncHud(force) {
  const sel = getSelected();
  const aliveCount = sel && sel.type === 'barracks'
    ? state.soldiers.filter(s => s.barracksId === sel.id && !s.dead).length
    : -1;
  const totalCount = sel && sel.type === 'barracks'
    ? state.soldiers.filter(s => s.barracksId === sel.id).length
    : -1;
  const sig = [state.lives, state.money, state.wave, state.phase, state.paused, state.speed,
    state.buildType, state.selectedId, sel ? sel.level : 0, aliveCount,
    state.money < (sel && sel.level < 3 ? upgradeCost(sel) : 0)].join('|');
  if (!force && sig === lastHudSig) return;
  lastHudSig = sig;

  statLives.textContent = state.lives;
  statGold.textContent = state.money;
  statWave.textContent = state.wave + '/' + activeWaves.length;
  hudLives.classList.toggle('flash', state.lives <= 5);

  if (state.phase === 'prep') {
    btnWave.textContent = '出征 · 第 ' + (state.wave + 1) + ' 波';
    btnWave.disabled = state.paused;
  } else if (state.phase === 'wave') {
    btnWave.textContent = '第 ' + state.wave + ' 波 · 交战中';
    btnWave.disabled = true;
  } else {
    btnWave.textContent = state.phase === 'won' ? '边境已守住' : '防线已失守';
    btnWave.disabled = true;
  }
  btnWave.classList.toggle('ready', state.phase === 'prep' && !state.paused);

  btnSpeed.textContent = state.speed + '×';
  btnPause.textContent = state.paused ? '继续' : '暂停';
  btnPause.disabled = gameOver() || state.phase === 'prep';
  pauseBadge.classList.toggle('show', state.paused && !gameOver());

  const cards = shop.querySelectorAll('.shop-card');
  for (const card of cards) {
    const type = card.dataset.type;
    card.classList.toggle('active', state.buildType === type);
    card.classList.toggle('no-money', state.money < TOWERS[type].cost);
  }

  const upBtn = panel.querySelector('[data-action="upgrade"]');
  if (upBtn && sel && sel.level < 3) {
    upBtn.classList.toggle('no-money', state.money < upgradeCost(sel));
  }
  const soldierCount = panel.querySelector('#soldierCount');
  if (soldierCount && aliveCount >= 0) {
    soldierCount.textContent = aliveCount + ' / ' + totalCount;
  }
}

function levelMapSvg(level) {
  const laneColors = ['#e0c27c', '#9dc2d8', '#b9a1e8'];
  const theme = level.theme;
  let grid = '';
  for (let x = 20; x < 240; x += 20) {
    grid += '<path d="M' + x + ' 0V150" stroke="rgba(225,214,172,.055)" stroke-width=".6"/>';
  }
  for (let y = 20; y < 150; y += 20) {
    grid += '<path d="M0 ' + y + 'H240" stroke="rgba(225,214,172,.055)" stroke-width=".6"/>';
  }
  const lines = level.paths.map(function (path, i) {
    const pts = path.map(function (pt) { return (pt[0] * 10 + 5) + ',' + (pt[1] * 10 + 5); }).join(' ');
    const color = laneColors[i % laneColors.length];
    return '<polyline points="' + pts + '" fill="none" stroke="rgba(6,10,7,.85)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".88"/>';
  }).join('');
  const starts = level.paths.map(function (path, i) {
    const y = path[0][1] * 10 + 5;
    return '<circle cx="4" cy="' + y + '" r="3.2" fill="' + laneColors[i % laneColors.length] + '" opacity=".9"/>';
  }).join('');
  const ends = level.paths.map(function (path, i) {
    const y = path[path.length - 1][1] * 10 + 5;
    return '<rect x="227" y="' + (y - 4) + '" width="9" height="8" rx="1" fill="#0a0d09" stroke="' + laneColors[i % laneColors.length] + '" stroke-width="1"/>';
  }).join('');
  return '<svg viewBox="0 0 240 150" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' +
    '<rect width="240" height="150" fill="' + theme.bg[0] + '"/>' +
    '<rect width="240" height="150" fill="url(#lv-glow-' + level.id + ')" opacity=".4"/>' +
    '<defs><radialGradient id="lv-glow-' + level.id + '" cx="50%" cy="15%" r="80%"><stop offset="0" stop-color="' + theme.accent + '" stop-opacity=".22"/><stop offset="1" stop-color="' + theme.accent + '" stop-opacity="0"/></radialGradient></defs>' +
    grid +
    '<rect x="228" y="6" width="8" height="138" fill="#35392c" stroke="rgba(230,205,150,.2)" stroke-width=".7"/>' +
    '<path d="M228 14h8M228 34h8M228 54h8M228 74h8M228 94h8M228 114h8M228 134h8" stroke="rgba(16,20,14,.6)" stroke-width="2"/>' +
    lines + starts + ends +
    '<path d="M0 140c36-10 54 5 82 0s50-8 80 1" fill="none" stroke="rgba(255,255,255,.035)" stroke-width="12"/>' +
    '</svg>';
}

function renderLevelCards() {
  levelGrid.innerHTML = LEVELS.map(function (level, i) {
    const current = state.levelStarted && i === currentLevelIndex;
    const cleared = clearedLevels.has(i);
    const cta = current && !gameOver()
      ? '继续当前战场'
      : (current ? '重战本关' : (cleared ? '已通关 · 再次挑战' : '进入战场'));
    return '<button class="level-card' + (current ? ' current' : '') + '" type="button" data-level="' + i + '" style="--level-accent:' + level.theme.accent + '"' + (current ? ' aria-current="true"' : '') + '>' +
      '<span class="level-map" aria-hidden="true">' + levelMapSvg(level) + '</span>' +
      '<span class="level-body">' +
        '<span class="level-card-head"><span class="level-index">LEVEL 0' + (i + 1) + '</span><span class="level-diff">' + level.difficulty + '</span></span>' +
        '<span class="level-name">' + level.name + '</span>' +
        '<span class="level-en">' + level.subtitle + '</span>' +
        '<span class="level-desc">' + level.desc + '</span>' +
        '<span class="level-meta"><span>' + level.paths.length + ' 条路线</span><span>' + level.lives + ' 生命</span><span>' + level.money + ' 金币</span></span>' +
        '<span class="level-cta">' + cta + '</span>' +
      '</span>' +
    '</button>';
  }).join('');
}

function syncLevelUI() {
  mapName.textContent = currentLevel.name;
  mapSub.textContent = currentLevel.subtitle + ' · ' + activePaths.length + ' 路线';
  btnMap.title = '切换关卡 · ' + currentLevel.name;
  btnMap.setAttribute('aria-label', '切换关卡，当前为' + currentLevel.name);
  canvas.setAttribute('aria-label', currentLevel.name + '塔防战场');
  document.title = '铁壁王国 · ' + currentLevel.name;
}

function openLevelMenu() {
  if (state.levelMenuOpen) return;
  state.levelMenuOpen = true;
  renderLevelCards();
  btnCloseLevels.hidden = !state.levelStarted;
  levelOverlay.classList.add('show');
  levelOverlay.setAttribute('aria-hidden', 'false');
  document.body.classList.add('level-open');
  if (state.levelStarted) SFX.play('click');
}

function closeLevelMenu() {
  if (!state.levelMenuOpen) return;
  state.levelMenuOpen = false;
  levelOverlay.classList.remove('show');
  levelOverlay.setAttribute('aria-hidden', 'true');
  btnCloseLevels.hidden = true;
  document.body.classList.remove('level-open');
}

function startLevel(index) {
  const level = LEVELS[index];
  if (!level) return;
  currentLevelIndex = index;
  currentLevel = level;
  activeWaves = level.waves;
  activeTheme = level.theme;
  activePaths = level.paths.map(function (grid, lane) { return makePath(grid, lane); });
  rebuildPathData();

  state.money = level.money;
  state.lives = level.lives;
  state.wave = 0;
  state.phase = 'prep';
  state.paused = false;
  state.speed = 1;
  state.buildType = null;
  state.selectedId = null;
  state.hover = null;
  state.towers = [];
  state.enemies = [];
  state.soldiers = [];
  state.projectiles = [];
  state.particles = [];
  state.spawnQueue = [];
  state.waveClock = 0;
  state.simTime = 0;
  state.accumulator = 0;
  state.hurt = 0;
  state.nextId = 1;
  state.levelStarted = true;
  state.levelMenuOpen = false;

  clearTimeout(toastTimer);
  toastEl.className = 'toast';
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden', 'true');
  pauseBadge.classList.remove('show');
  levelOverlay.classList.remove('show');
  levelOverlay.setAttribute('aria-hidden', 'true');
  btnCloseLevels.hidden = true;
  document.body.classList.remove('level-open');

  syncLevelUI();
  buildBackground();
  lastHudSig = '';
  SFX.play('click');
  renderPanel();
  syncHud(true);
  showToast('第 ' + (index + 1) + ' 关 · ' + level.name, 'good');
}

function toggleBuild(type) {
  if (gameOver() || state.levelMenuOpen) return;
  if (!TOWERS[type]) return;
  state.buildType = state.buildType === type ? null : type;
  state.selectedId = null;
  state.hover = null;
  SFX.play('click');
  renderPanel();
  syncHud(true);
}

function togglePause() {
  if (gameOver() || state.phase === 'prep') return;
  state.paused = !state.paused;
  state.accumulator = 0;
  SFX.play('click');
  syncHud(true);
}

function toggleSpeed() {
  if (gameOver()) return;
  state.speed = state.speed === 1 ? 2 : 1;
  SFX.play('click');
  syncHud(true);
}

function canvasPoint(ev) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: clamp((ev.clientX - rect.left) / rect.width * W, 0, W - 0.001),
    y: clamp((ev.clientY - rect.top) / rect.height * H, 0, H - 0.001)
  };
}

function handleBoardClick(p) {
  if (gameOver()) return;
  const gx = Math.floor(p.x / CELL);
  const gy = Math.floor(p.y / CELL);
  const existing = inBounds(gx, gy) ? towerAt(gx, gy) : null;

  if (state.buildType) {
    if (existing) {
      selectTower(existing.id);
    } else {
      tryBuild(state.buildType, gx, gy);
    }
    return;
  }

  if (existing) {
    selectTower(existing.id);
    return;
  }

  const sel = getSelected();
  if (sel && sel.type === 'barracks') {
    const c = towerCenter(sel);
    const stats = levelStats(sel);
    if (dist2d(p.x, p.y, c.x, c.y) > stats.rally + 2) {
      showToast('集结点太远了，请点在兵营 ' + stats.rally + ' 范围以内', 'warn');
      SFX.play('deny');
      return;
    }
    const snap = nearestOnPath(p.x, p.y);
    if (dist2d(snap.x, snap.y, c.x, c.y) > stats.rally + 2) {
      showToast('这里离小路太远，换个位置吧', 'warn');
      SFX.play('deny');
      return;
    }
    setRally(sel, snap);
    return;
  }

  state.selectedId = null;
  renderPanel();
  syncHud(true);
}

shop.addEventListener('click', ev => {
  const card = ev.target.closest('.shop-card');
  if (!card) return;
  toggleBuild(card.dataset.type);
});

panel.addEventListener('click', ev => {
  const btn = ev.target.closest('[data-action]');
  if (!btn) return;
  if (btn.dataset.action === 'upgrade') upgradeSelected();
  if (btn.dataset.action === 'sell') sellSelected();
});

function updateSoundButton() {
  const muted = SFX.isMuted();
  btnSound.classList.toggle('muted', muted);
  btnSound.title = muted ? '音效：关' : '音效：开';
  btnSound.setAttribute('aria-label', muted ? '开启音效' : '关闭音效');
  btnSound.setAttribute('aria-pressed', String(muted));
}

btnWave.addEventListener('click', startWave);
btnSpeed.addEventListener('click', toggleSpeed);
btnPause.addEventListener('click', togglePause);
btnRestart.addEventListener('click', restart);
btnSound.addEventListener('click', () => {
  const muted = SFX.toggleMuted();
  updateSoundButton();
  if (!muted) SFX.play('click');
  showToast(muted ? '音效已关闭' : '音效已开启');
});
btnMap.addEventListener('click', openLevelMenu);
btnChooseLevel.addEventListener('click', openLevelMenu);
btnCloseLevels.addEventListener('click', () => {
  if (state.levelStarted) {
    SFX.play('click');
    closeLevelMenu();
  }
});
btnNextLevel.addEventListener('click', () => {
  if (currentLevelIndex < LEVELS.length - 1) startLevel(currentLevelIndex + 1);
});
levelGrid.addEventListener('click', ev => {
  const card = ev.target.closest('[data-level]');
  if (!card) return;
  const index = Number(card.dataset.level);
  if (index === currentLevelIndex && state.levelStarted && !gameOver()) {
    SFX.play('click');
    closeLevelMenu();
    return;
  }
  startLevel(index);
});

// AudioContext must first be created/resumed inside a user gesture.
window.addEventListener('pointerdown', () => SFX.unlock(), { capture: true, once: true });
window.addEventListener('keydown', () => SFX.unlock(), { capture: true, once: true });
updateSoundButton();

canvas.addEventListener('pointermove', ev => {
  if (gameOver()) return;
  if (state.buildType) {
    const p = canvasPoint(ev);
    state.hover = { x: p.x, y: p.y, gx: Math.floor(p.x / CELL), gy: Math.floor(p.y / CELL) };
  } else if (state.hover) {
    state.hover = null;
  }
});
canvas.addEventListener('pointerleave', () => { state.hover = null; });
canvas.addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return;
  ev.preventDefault();
  const p = canvasPoint(ev);
  if (state.buildType) {
    state.hover = { x: p.x, y: p.y, gx: Math.floor(p.x / CELL), gy: Math.floor(p.y / CELL) };
  }
  handleBoardClick(p);
}, { passive: false });

document.addEventListener('keydown', ev => {
  if (ev.repeat) return;
  const tag = (ev.target && ev.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (state.levelMenuOpen) {
    if (ev.key === 'Escape' && state.levelStarted) {
      ev.preventDefault();
      closeLevelMenu();
    }
    return;
  }
  if (ev.code === 'Space') {
    ev.preventDefault();
    togglePause();
    return;
  }
  if (ev.key === 'Escape') {
    state.buildType = null;
    state.selectedId = null;
    state.hover = null;
    SFX.play('click');
    renderPanel();
    syncHud(true);
    return;
  }
  if (ev.key === '1' || ev.key === '2' || ev.key === '3') {
    ev.preventDefault();
    toggleBuild(['archer', 'barracks', 'mage'][Number(ev.key) - 1]);
    return;
  }
  if (ev.key === 'f' || ev.key === 'F') {
    ev.preventDefault();
    toggleSpeed();
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.phase === 'wave' && !state.paused) {
    state.paused = true;
    syncHud(true);
  }
});

/* ================================================================== *
 *  动态绘制
 * ================================================================== */
function drawPathFlow() {
  const offset = state.simTime * 26;
  for (const path of activePaths) {
    for (let d = 22; d < path.length; d += 86) {
      const p = pointOnPath(path, (d + offset) % path.length);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.strokeStyle = 'rgba(239,214,158,.2)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-4, -4);
      ctx.lineTo(2.5, 0);
      ctx.lineTo(-4, 4);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function rangeCircle(x, y, radius, color, fillAlpha, dash) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, TAU);
  ctx.fillStyle = color;
  ctx.globalAlpha = fillAlpha;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  if (dash) ctx.setLineDash([4, 6]);
  ctx.stroke();
  ctx.restore();
}

function drawSelection() {
  const t = getSelected();
  if (!t) return;
  const c = towerCenter(t);
  const stats = levelStats(t);
  if (t.type === 'barracks') {
    rangeCircle(c.x, c.y, stats.rally, '#9dc2d8', 0.035, true);
    ctx.save();
    ctx.strokeStyle = 'rgba(157,194,216,.35)';
    ctx.setLineDash([3, 5]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(t.rally.x, t.rally.y);
    ctx.stroke();
    ctx.restore();
  } else {
    rangeCircle(c.x, c.y, stats.range, TOWERS[t.type].accent, 0.045, true);
  }
}

function drawHover() {
  if (!state.buildType || !state.hover) return;
  const { gx, gy } = state.hover;
  if (!inBounds(gx, gy)) return;
  const cfg = TOWERS[state.buildType];
  const x = gx * CELL, y = gy * CELL;
  const occupied = !!towerAt(gx, gy) || isPathCell(gx, gy);
  const affordable = state.money >= cfg.cost;
  const ok = !occupied;
  const color = !ok ? 'rgba(217,107,95,.8)' : (affordable ? 'rgba(170,208,137,.85)' : 'rgba(226,183,101,.85)');

  ctx.save();
  ctx.fillStyle = !ok ? 'rgba(217,107,95,.14)' : 'rgba(170,208,137,.1)';
  if (!ok || !affordable) ctx.fillStyle = !ok ? 'rgba(217,107,95,.14)' : 'rgba(226,183,101,.1)';
  ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.setLineDash([4, 3]);
  ctx.strokeRect(x + 2.5, y + 2.5, CELL - 5, CELL - 5);
  ctx.setLineDash([]);
  const c = { x: x + CELL / 2, y: y + CELL / 2 };
  const radius = state.buildType === 'barracks' ? cfg.levels[0].rally : cfg.levels[0].range;
  rangeCircle(c.x, c.y, radius, color, 0.025, true);
  if (ok) {
    const ghost = {
      type: state.buildType, gx, gy, level: 1,
      angle: -Math.PI / 2, builtAt: state.simTime - 2,
      fireAt: -10, rally: null
    };
    drawTower(ghost, 0.45, true);
  }
  ctx.restore();
}

function drawTower(t, alpha, ghost) {
  const c = towerCenter(t);
  const cfg = TOWERS[t.type];
  const stats = levelStats(t);
  const age = state.simTime - (t.builtAt || 0);
  const scale = ghost ? 1 : clamp(0.7 + age * 7, 0.7, 1);
  const selected = state.selectedId === t.id;

  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.translate(c.x, c.y);
  ctx.scale(scale, scale);

  // ground shadow + base
  ctx.fillStyle = 'rgba(0,0,0,.26)';
  ctx.beginPath();
  ctx.ellipse(1, 7, 18, 8, 0, 0, TAU);
  ctx.fill();

  if (selected) {
    ctx.strokeStyle = 'rgba(240,211,145,.78)';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(0, 4, 19, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // stone base
  ctx.beginPath();
  ctx.moveTo(-15, 5);
  ctx.lineTo(-17, 1);
  ctx.lineTo(-12, -8);
  ctx.lineTo(12, -8);
  ctx.lineTo(17, 1);
  ctx.lineTo(15, 5);
  ctx.lineTo(10, 10);
  ctx.lineTo(-10, 10);
  ctx.closePath();
  ctx.fillStyle = '#37352a';
  ctx.fill();
  ctx.strokeStyle = 'rgba(12,14,10,.7)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-13, 1);
  ctx.lineTo(-9, -5);
  ctx.lineTo(9, -5);
  ctx.lineTo(13, 1);
  ctx.lineTo(9, 6);
  ctx.lineTo(-9, 6);
  ctx.closePath();
  ctx.fillStyle = '#4b4635';
  ctx.fill();

  if (t.type === 'archer') {
    // wooden tower
    ctx.fillStyle = '#5c432c';
    ctx.fillRect(-8, -17, 16, 23);
    ctx.fillStyle = '#6d5135';
    ctx.fillRect(-8, -17, 4, 23);
    ctx.strokeStyle = 'rgba(38,26,16,.65)';
    ctx.lineWidth = 0.9;
    for (let x = -6; x <= 6; x += 4) {
      ctx.beginPath();
      ctx.moveTo(x, -16);
      ctx.lineTo(x, 4);
      ctx.stroke();
    }
    // roof
    ctx.beginPath();
    ctx.moveTo(-12, -14);
    ctx.lineTo(0, -26);
    ctx.lineTo(12, -14);
    ctx.closePath();
    ctx.fillStyle = '#33452f';
    ctx.fill();
    ctx.strokeStyle = '#1e2b1e';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(220,199,139,.36)';
    ctx.beginPath();
    ctx.moveTo(-8, -16);
    ctx.lineTo(0, -23);
    ctx.stroke();
    // glowing bow
    ctx.save();
    ctx.translate(0, -7);
    ctx.rotate(t.angle);
    ctx.strokeStyle = 'rgba(226,206,146,.9)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(0, 0, 7, -1.05, 1.05);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,240,195,.4)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.lineTo(5, 0);
    ctx.stroke();
    ctx.restore();
    // flag
    ctx.strokeStyle = '#8c7349';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(8, -24);
    ctx.lineTo(8, -33);
    ctx.stroke();
    ctx.fillStyle = '#6f3a31';
    ctx.beginPath();
    ctx.moveTo(8.5, -33);
    ctx.lineTo(17, -30);
    ctx.lineTo(8.5, -26);
    ctx.closePath();
    ctx.fill();
  } else if (t.type === 'mage') {
    // stone spire
    ctx.fillStyle = '#4e4a54';
    ctx.beginPath();
    ctx.moveTo(-8, 4);
    ctx.lineTo(-7, -18);
    ctx.lineTo(7, -18);
    ctx.lineTo(8, 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#625d6c';
    ctx.beginPath();
    ctx.moveTo(-7, -18);
    ctx.lineTo(0, -27);
    ctx.lineTo(7, -18);
    ctx.closePath();
    ctx.fill();
    // roof
    ctx.beginPath();
    ctx.moveTo(-11, -21);
    ctx.lineTo(0, -35);
    ctx.lineTo(11, -21);
    ctx.closePath();
    ctx.fillStyle = '#40335b';
    ctx.fill();
    ctx.strokeStyle = '#261e37';
    ctx.stroke();
    // window
    ctx.fillStyle = 'rgba(198,174,255,.85)';
    ctx.beginPath();
    ctx.arc(0, -11, 2.2, 0, TAU);
    ctx.fill();
    // orb
    const pulse = 0.84 + Math.sin(state.simTime * 3.2 + t.id) * 0.08;
    const glow = ctx.createRadialGradient(0, -30, 1, 0, -30, 12);
    glow.addColorStop(0, 'rgba(224,204,255,.98)');
    glow.addColorStop(0.35, 'rgba(181,151,244,.8)');
    glow.addColorStop(1, 'rgba(145,109,225,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, -30, 12 * pulse, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#d9c6ff';
    ctx.beginPath();
    ctx.arc(0, -30, 3.3, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(207,185,255,.4)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(0, -30, 7, 0, TAU);
    ctx.stroke();
    // banner
    ctx.fillStyle = '#4d3b69';
    ctx.beginPath();
    ctx.moveTo(-12, -4);
    ctx.lineTo(-12, 4);
    ctx.lineTo(-6, 1);
    ctx.lineTo(-12, -4);
    ctx.fill();
  } else {
    // barracks longhouse
    ctx.fillStyle = '#4b3c2b';
    ctx.fillRect(-13, -10, 26, 17);
    ctx.fillStyle = '#5e4b34';
    ctx.fillRect(-13, -10, 26, 4);
    ctx.strokeStyle = 'rgba(30,22,14,.64)';
    ctx.lineWidth = 0.9;
    for (let x = -10; x <= 10; x += 5) {
      ctx.beginPath(); ctx.moveTo(x, -7); ctx.lineTo(x, 6); ctx.stroke();
    }
    // roof
    ctx.beginPath();
    ctx.moveTo(-16, -10);
    ctx.lineTo(0, -25);
    ctx.lineTo(16, -10);
    ctx.closePath();
    ctx.fillStyle = '#2e442f';
    ctx.fill();
    ctx.strokeStyle = '#1b291c';
    ctx.stroke();
    // door
    ctx.fillStyle = '#2b2118';
    roundRect(ctx, -3.5, -5, 7, 12, 2);
    ctx.fill();
    // shield emblem
    ctx.fillStyle = '#9dc2d8';
    ctx.beginPath();
    ctx.moveTo(0, -17);
    ctx.lineTo(5, -14.5);
    ctx.lineTo(5, -10);
    ctx.lineTo(0, -6.5);
    ctx.lineTo(-5, -10);
    ctx.lineTo(-5, -14.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(35,51,60,.7)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
    // banner pole
    ctx.strokeStyle = '#8c7349';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(12, -20);
    ctx.lineTo(12, -32);
    ctx.stroke();
    ctx.fillStyle = '#456377';
    ctx.beginPath();
    ctx.moveTo(12.5, -32);
    ctx.lineTo(21, -29);
    ctx.lineTo(12.5, -25);
    ctx.closePath();
    ctx.fill();
  }

  // level pips
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(-7 + i * 7, 15, 1.7, 0, TAU);
    ctx.fillStyle = i < t.level ? (ghost ? 'rgba(255,255,255,.4)' : '#e4c985') : 'rgba(255,255,255,.14)';
    ctx.fill();
  }

  // firing muzzle flash
  if (!ghost && state.simTime - (t.fireAt || -10) < 0.1) {
    ctx.fillStyle = 'rgba(255,228,158,.55)';
    ctx.beginPath();
    ctx.arc(Math.cos(t.angle) * 10, t.type === 'mage' ? -23 : -7, 3, 0, TAU);
    ctx.fill();
  }

  ctx.restore();
}

function drawRally(t) {
  if (t.type !== 'barracks' || !t.rally) return;
  const selected = state.selectedId === t.id;
  const x = t.rally.x, y = t.rally.y;
  ctx.save();
  ctx.globalAlpha = selected ? 1 : 0.72;
  ctx.strokeStyle = 'rgba(17,25,29,.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 5, y + 4);
  ctx.lineTo(x + 5, y - 20);
  ctx.stroke();
  ctx.strokeStyle = selected ? '#e7cf96' : '#a9c4d2';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x + 5, y + 4);
  ctx.lineTo(x + 5, y - 20);
  ctx.stroke();
  ctx.fillStyle = selected ? '#9dc2d8' : '#577e92';
  ctx.beginPath();
  ctx.moveTo(x + 6, y - 20);
  ctx.lineTo(x + 18, y - 16);
  ctx.lineTo(x + 6, y - 12);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(229,211,162,.35)';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  ctx.fillStyle = 'rgba(12,18,13,.7)';
  ctx.beginPath();
  ctx.ellipse(x + 5, y + 5, 4.5, 2, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  const c = ENEMIES[e.type];
  const flash = e.hit > 0;
  const r = e.radius;
  ctx.save();
  ctx.translate(e.x, e.y);

  ctx.fillStyle = 'rgba(0,0,0,.27)';
  ctx.beginPath();
  ctx.ellipse(0, 6, r * 0.9, r * 0.43, 0, 0, TAU);
  ctx.fill();

  if (e.blockedBy) {
    ctx.strokeStyle = 'rgba(232,201,135,.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.ellipse(0, 4, r + 5, r * 0.55 + 2, 0, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.rotate(e.angle);

  if (e.type === 'goblin') {
    ctx.fillStyle = flash ? '#d8efb0' : '#5e8b44';
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 6, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = flash ? '#efffd1' : '#7ca658';
    ctx.beginPath();
    ctx.arc(6, -1, 5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#4a7038';
    ctx.beginPath();
    ctx.moveTo(8, -4); ctx.lineTo(13, -7); ctx.lineTo(10, -1); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8, 2); ctx.lineTo(13, 5); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f0d687';
    ctx.beginPath(); ctx.arc(9.5, -2, 1, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#3b2d1e';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-6, -1); ctx.lineTo(-9, 3); ctx.stroke();
    ctx.restore();
  } else if (e.type === 'wolf') {
    ctx.fillStyle = flash ? '#eee6d4' : '#70706a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 11, 4.7, 0, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(9, -1, 4.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#565650';
    ctx.beginPath();
    ctx.moveTo(8, -5); ctx.lineTo(10, -9); ctx.lineTo(12, -4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#4a4a43';
    ctx.lineWidth = 1.4;
    for (const x of [-7, -2, 4]) {
      ctx.beginPath(); ctx.moveTo(x, 3); ctx.lineTo(x - 1, 8); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(-10, -1); ctx.lineTo(-15, -5); ctx.stroke();
    // rider
    ctx.fillStyle = '#4e5b48';
    ctx.beginPath(); ctx.arc(-1, -7, 3.1, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7e6b45';
    ctx.fillRect(-2, -6, 2, 5);
    ctx.strokeStyle = '#d8c793';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(1, -10); ctx.lineTo(7, -12); ctx.stroke();
    ctx.restore();
  } else if (e.type === 'orc') {
    ctx.fillStyle = flash ? '#ffe9cf' : '#80533d';
    ctx.beginPath();
    ctx.ellipse(0, 0, 11, 9, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#3c3a32';
    ctx.beginPath();
    ctx.ellipse(-3, 0, 7, 7.5, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#6a4432';
    ctx.beginPath();
    ctx.arc(8, -1, 5.5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#d55645';
    ctx.beginPath(); ctx.arc(10, -2, 1.1, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c9b890';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(6, -6); ctx.lineTo(9, -11); ctx.stroke();
    ctx.strokeStyle = '#4d3b29';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-8, -3); ctx.lineTo(-13, 3); ctx.stroke();
    ctx.restore();
  } else {
    // ogre chief
    ctx.fillStyle = flash ? '#ffe1c5' : '#9b5c40';
    ctx.beginPath();
    ctx.ellipse(0, 0, 20, 17, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#71402d';
    ctx.beginPath();
    ctx.arc(14, -2, 9, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#d7b06d';
    ctx.beginPath();
    ctx.moveTo(10, -9); ctx.lineTo(13, -19); ctx.lineTo(16, -8); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(18, -6); ctx.lineTo(25, -11); ctx.lineTo(21, -1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f1d36d';
    ctx.beginPath(); ctx.arc(17, -3, 2, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#57422d';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-15, 4); ctx.lineTo(-24, -8); ctx.stroke();
    ctx.fillStyle = '#4e4533';
    ctx.beginPath();
    ctx.arc(-24, -10, 6, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#bea77a';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(-24, -10, 7, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // blocked spark
  if (e.blockedBy) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.strokeStyle = 'rgba(246,216,148,.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-2, -r - 5); ctx.lineTo(2, -r - 8);
    ctx.moveTo(2, -r - 5); ctx.lineTo(-2, -r - 8);
    ctx.stroke();
    ctx.restore();
  }

  if (e.boss || e.hp < e.maxHp) {
    const w = e.boss ? 52 : Math.max(24, e.radius * 2.4);
    const bx = e.x - w / 2;
    const by = e.y - e.radius - (e.boss ? 18 : 12);
    ctx.fillStyle = 'rgba(7,10,7,.78)';
    roundRect(ctx, bx, by, w, 3.5, 1.8);
    ctx.fill();
    const ratio = clamp(e.hp / e.maxHp, 0, 1);
    ctx.fillStyle = e.boss ? '#d66b52' : ratio > 0.5 ? '#a7c46d' : ratio > 0.25 ? '#d8b36a' : '#d96b5f';
    roundRect(ctx, bx + 0.5, by + 0.5, Math.max(1, (w - 1) * ratio), 2.5, 1.2);
    ctx.fill();
  }
}

function drawSoldier(s) {
  if (s.dead) return;
  const bob = s.state === 'move' ? Math.sin(state.simTime * 14 + s.id) * 1.2 : 0;
  ctx.save();
  ctx.translate(s.x, s.y + bob);
  ctx.scale(1.12, 1.12);

  // faction ring keeps friendly infantry readable against the road
  ctx.strokeStyle = 'rgba(139,190,212,.42)';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.ellipse(0, 5, 8, 3.4, 0, 0, TAU);
  ctx.stroke();

  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(0, 5, 6, 2.6, 0, 0, TAU);
  ctx.fill();

  // legs
  ctx.strokeStyle = '#2f3d43';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-2, 2); ctx.lineTo(-3, 7);
  ctx.moveTo(2, 2); ctx.lineTo(3, 7);
  ctx.stroke();

  // cloak and torso
  ctx.fillStyle = '#426a7b';
  ctx.beginPath();
  ctx.moveTo(-4.5, -4);
  ctx.lineTo(4.5, -4);
  ctx.lineTo(5.5, 4);
  ctx.lineTo(-5.5, 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#769aaa';
  ctx.fillRect(-3.5, -7, 7, 5);

  // shield
  ctx.fillStyle = '#91b4c3';
  ctx.beginPath();
  ctx.arc(-5, -3, 4, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#d9c58e';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-5, -6); ctx.lineTo(-5, 0);
  ctx.stroke();

  // sword
  const swing = s.state === 'fight' ? Math.sin(state.simTime * 16 + s.id) * 0.45 : 0;
  ctx.save();
  ctx.scale(s.facing || 1, 1);
  ctx.translate(4, -3);
  ctx.rotate(-0.9 + swing);
  ctx.strokeStyle = '#e2d6b5';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(10, 0);
  ctx.stroke();
  ctx.strokeStyle = '#c3a46b';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(1, -2); ctx.lineTo(1, 2);
  ctx.stroke();
  ctx.restore();

  // head + helm
  ctx.fillStyle = '#d3b28b';
  ctx.beginPath();
  ctx.arc(0, -9, 3.2, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#aebfc4';
  ctx.beginPath();
  ctx.arc(0, -10, 3.6, Math.PI, TAU);
  ctx.fill();
  ctx.strokeStyle = '#6b7e84';
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, -10); ctx.stroke();

  if (s.hp < s.maxHp) {
    const w = 16;
    const ratio = clamp(s.hp / s.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(7,10,7,.8)';
    roundRect(ctx, -w / 2, -19, w, 2.8, 1.2);
    ctx.fill();
    ctx.fillStyle = ratio > 0.5 ? '#9cc7a0' : ratio > 0.25 ? '#d8b36a' : '#d96b5f';
    roundRect(ctx, -w / 2 + 0.4, -18.6, Math.max(1, (w - 0.8) * ratio), 2, 1);
    ctx.fill();
  }
  ctx.restore();
}

function drawProjectile(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.type === 'arrow') {
    ctx.rotate(p.angle);
    ctx.strokeStyle = '#eadcb9';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-9, 0); ctx.lineTo(6, 0);
    ctx.stroke();
    ctx.fillStyle = '#d8c08a';
    ctx.beginPath();
    ctx.moveTo(7, 0); ctx.lineTo(2, -2.2); ctx.lineTo(2, 2.2); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(240,224,179,.55)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-9, 0); ctx.lineTo(-12, -2);
    ctx.moveTo(-9, 0); ctx.lineTo(-12, 2);
    ctx.stroke();
  } else {
    const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, 12);
    glow.addColorStop(0, 'rgba(244,232,255,.95)');
    glow.addColorStop(0.3, 'rgba(196,168,255,.8)');
    glow.addColorStop(1, 'rgba(150,114,230,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8dbff';
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of state.particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHurt() {
  if (state.hurt <= 0) return;
  const a = state.hurt;
  const grad = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.76);
  grad.addColorStop(0, 'rgba(160,35,30,0)');
  grad.addColorStop(1, 'rgba(160,35,30,' + (0.3 * a) + ')');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawPathFlow();
  drawSelection();
  drawHover();
  for (const t of state.towers) drawRally(t);
  for (const t of state.towers) drawTower(t);
  for (const e of state.enemies) drawEnemy(e);
  for (const s of state.soldiers) drawSoldier(s);
  for (const p of state.projectiles) drawProjectile(p);
  drawParticles();
  drawHurt();
}

/* ================================================================== *
 *  尺寸、循环与启动
 * ================================================================== */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  buildBackground();
}

function loop(now) {
  requestAnimationFrame(loop);
  if (!lastFrame) lastFrame = now;
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (dt > 0.1) dt = 0.1; // avoid huge catch-up after tab switch
  if (!state.paused && !state.levelMenuOpen && !gameOver()) {
    state.accumulator += dt * state.speed;
    let steps = 0;
    while (state.accumulator >= STEP && steps < 8) {
      update(STEP);
      state.accumulator -= STEP;
      steps++;
      if (gameOver()) {
        state.accumulator = 0;
        break;
      }
    }
  }
  draw();
  syncHud();
}

window.addEventListener('resize', resize);

resize();
syncLevelUI();
renderLevelCards();
renderPanel();
syncHud(true);
openLevelMenu();
requestAnimationFrame(loop);

if (new URLSearchParams(location.search).has('debug')) {
  window.__TD__ = {
    snapshot() {
      return {
        levelIndex: currentLevelIndex,
        levelName: currentLevel.name,
        laneCount: activePaths.length,
        money: state.money,
        lives: state.lives,
        wave: state.wave,
        phase: state.phase,
        paused: state.paused,
        speed: state.speed,
        selected: state.selectedId,
        levelMenuOpen: state.levelMenuOpen,
        towers: state.towers.map(t => ({ id: t.id, type: t.type, gx: t.gx, gy: t.gy, level: t.level, rally: t.rally })),
        enemies: state.enemies.map(e => ({ id: e.id, type: e.type, pathIndex: e.pathIndex, hp: e.hp, maxHp: e.maxHp, dist: e.dist, blockedBy: e.blockedBy })),
        soldiers: state.soldiers.map(s => ({ id: s.id, barracksId: s.barracksId, hp: s.hp, maxHp: s.maxHp, dead: s.dead, targetId: s.targetId, x: s.x, y: s.y }))
      };
    },
    place(type, gx, gy) { return tryBuild(type, gx, gy); },
    startLevel(index) { startLevel(index); },
    openLevelMenu() { openLevelMenu(); },
    closeLevelMenu() { closeLevelMenu(); },
    startWave,
    setSpeed(n) { state.speed = n === 2 ? 2 : 1; syncHud(true); },
    pause(v) { state.paused = !!v; syncHud(true); },
    grant(n) { state.money += Math.max(0, Math.floor(n || 0)); syncHud(true); },
    spawn(type) { if (ENEMIES[type]) { spawnEnemy(type); syncHud(true); } },
    sound() { return SFX.debugState(); },
    select(id) { selectTower(id); },
    upgrade() { upgradeSelected(); },
    sell() { sellSelected(); },
    step(seconds) {
      const wasPaused = state.paused;
      state.paused = true;
      let remaining = Math.max(0, Math.min(seconds || 0, 1800));
      let guard = 0;
      while (remaining > 0 && !gameOver() && guard < 108000) {
        update(STEP);
        remaining -= STEP;
        guard++;
      }
      state.paused = wasPaused;
      draw();
      syncHud(true);
      return this.snapshot();
    },
    moveRally(id, x, y) {
      const t = getTower(id);
      if (!t || t.type !== 'barracks') return false;
      const c = towerCenter(t);
      const snap = nearestOnPath(x, y);
      if (dist2d(x, y, c.x, c.y) > 130 || dist2d(snap.x, snap.y, c.x, c.y) > 132) return false;
      setRally(t, snap);
      return true;
    },
    hurt(n) {
      state.lives = Math.max(0, state.lives - (n || 1));
      if (state.lives <= 0) endGame('lost');
      syncHud(true);
    }
  };
}

})();
</script>
